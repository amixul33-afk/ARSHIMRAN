<style>
:root{--bg:#E8EDF3;--ink:#111B2A;--soft:#51607A;--line:#C5CFDD;--accent:#1D3FA6;--rain:rgba(29,63,166,.16);color-scheme:light}

html{-webkit-text-size-adjust:100%}

#progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:5}
main{position:relative;z-index:1;max-width:40rem;margin:0 auto;padding:0 1.4rem 5rem}
a{color:var(--accent);text-underline-offset:.25em}

.story-item h2 a{color:var(--ink);text-decoration:none}

.excerpt{margin:.7rem 0 0;color:var(--soft);font-size:1rem;line-height:1.85}

.cover::after{content:"";position:absolute;inset:.45rem;border:1px solid rgba(255,255,255,.35);border-radius:2px;pointer-events:none}

.c0{background-color:#1D3FA6}.c1{background-color:#244B5A}.c2{background-color:#4A3A6B}.c3{background-color:#1F5C55}
.thumb .cover{font-size:.85rem}
.hero{width:11rem;margin:0 auto 2rem}
.hero .cover{font-size:1.3rem}
.article-head{text-align:center;padding:.5rem 0 2.4rem}
.article-head h1{font-family:"Tiro Bangla","Noto Serif Bengali",serif;font-weight:400;font-size:clamp(2rem,8vw,3rem);line-height:1.35;margin:0 0 .8rem}
.article-head .meta{justify-content:center}
.prose{font-size:clamp(1.12rem,2.6vw,1.24rem);line-height:2.1}
.prose p{margin:0 0 1.5rem}
.prose .end{text-align:center;color:var(--soft);margin-top:3rem;letter-spacing:.08em}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:3.5rem}

<script>
/* ===== এখানে আপনার গল্প যোগ করুন =====
   নতুন গল্পের জন্য নিচের তালিকায় একটা নতুন { } ব্লক যোগ করুন।
   id: ইংরেজি অক্ষর, সংখ্যা বা হাইফেন (যেমন "nodir-dhare")
   cover: নিজের কভার ছবির ফাইলের নাম (যেমন "covers/nodir.jpg"); ফাঁকা ("") রাখলে শিরোনাম দিয়ে নিজে থেকেই একটা কভার তৈরি হবে।
   টেক্সটে নতুন অনুচ্ছেদের জন্য একটা ফাঁকা লাইন রাখুন। */
const SITE = {
  title: "ARSH IMRAN",
  intro: "এখানে আমি আমার লেখা গল্পগুলো রাখি।",
  author: "Arsh Imran"
};

const STORIES = [
  {
    id: "shrabaner-sondhebelay-1",
    cover: "shrabaner-sondhebelay.jpg",
    title: "শ্রাবণের সন্ধেবেলায় (প্রথম পর্ব)",
    date: "৪ নভেম্বর ২০২৬",
    text: `মানুষের জীবনে কিছু দিন আসে যেদিন সকালবেলা ঘুম ভাঙার সঙ্গে সঙ্গেই মনে হয়—আজ নিশ্চয়ই কোনো একটি অলৌকিক কাণ্ড ঘটবে। শুভ্রাংশুর ঘুম যখন ভাঙল, তখন ঘরের একচিলতে কাঠের জানালার ফাঁক গলে একঝাঁক ঠান্ডা বাতাস এসে তার মুখে লাগল। বাতাসটা সাধারণ কোনো বাতাস নয়; এতে সোঁদা মাটির ঘ্রাণ আর ভিজা কদম ফুলের গন্ধ মাখানো। বাইরে তুমুল বৃষ্টি নামার আগের যে থমথমে ধূসর আলো, সেই আলোয় পুরো কামরাটা এক অদ্ভুত নীলচে রূপ নিয়েছে। শুভ্রাংশু বালিশে মাথা রেখেই বুঝল, আজ শ্রাবণের কোনো এক অলুক্ষণে দিন।

ঠিক তখনই পাশের ঘর থেকে বড়মামা মোবারক হোসেনের চিল-চিৎকার ভেসে এলো—'শুভ্র! ওরে ও নবাব সিরাজউদ্দৌলার খালাতো ভাই শুভ্র! তুই কি এখনও নাক ডেকে কুম্ভকর্ণের বংশমর্যাদা রক্ষা করছিস? শিগগির এদিকে আয়! একটা জাতীয় বিপর্যয় ঘটে গেছে!' শুভ্রাংশু দীর্ঘশ্বাস ফেলল। বড়মামার জীবনে প্রতি সপ্তাহে অন্তত তিনটি 'জাতীয় বিপর্যয়' ঘটে। গত মঙ্গলবার তাঁর জাতীয় বিপর্যয় ছিল—তিনি আবিষ্কার করেছিলেন যে তাঁর বাঁ পায়ের বুড়ো আঙুলের নখটা ডান পায়ের চেয়ে দুই মিলিমিটার বেশি চওড়া। সেই দুঃখে তিনি সারা দুপুর ভাত না খেয়ে বারান্দায় বসে রবীন্দ্রনাথের মৃত্যুদিনের আবহাওয়া নিয়ে গবেষণা করেছিলেন।

শুভ্রাংশু চোখ কচলাতে কচলাতে মামার পড়ার ঘরে গিয়ে দাঁড়াল। ঘরটির অবস্থা দেখলে যে কোনো সভ্য মানুষের মূর্ছা যাওয়ার কথা। চারপাশে মেঝে থেকে ছাদ পর্যন্ত পুরানো বইয়ের স্তূপ। মাঝখানে একটা ভাঙা সেগুন কাঠের গোল টেবিল। টেবিলে জ্বলছে একটা পিতলের হারিকেন, যদিও এখন সকাল আটটা। বড়মামা খালি গায়ে, লুঙ্গি মালকোঁচা মেরে একটা বিশাল ম্যাগনিফাইং গ্লাস দিয়ে একটা সেদ্ধ ডিম পর্যবেক্ষণ করছেন। শুভ্রাংশুকে দেখেই তিনি গম্ভীর গলায় বললেন, 'শুভ্র, তোকে একটা বৈজ্ঞানিক সত্য বলি। মানুষের জীবনে তিনটি জিনিস কোনোদিন প্রেডিক্ট করা যায় না—এক হচ্ছে ট্রেনের সময়সূচি, দুই হচ্ছে নারীর মন, আর তিন হচ্ছে হাঁসের ডিমের কুসুমের অবস্থান। দেখ, এই ডিমটার কুসুম মাঝামাঝি না থেকে অদ্ভুতভাবে উত্তর-পূর্ব কোণে হেলে আছে। এর স্পষ্ট অর্থ হলো—আজ পৃথিবীর ম্যাগনেটিক ফিল্ডে কোনো গণ্ডগোল হয়েছে!'

শুভ্রাংশু আলগোছে টেবিলের এক কোণে বসে বলল, 'মামা, এটা হাঁসের ডিম না, মুরগির ডিম। আর ময়না বুজি এটা ফ্রিজ থেকে নামিয়ে তাড়াহুড়ো করে বেশি তাপে সেদ্ধ করেছে, তাই কুসুম সরে গেছে। ম্যাগনেটিক ফিল্ডের কোনো দোষ নেই।' বড়মামা চশমার ফাঁক দিয়ে তার দিকে এমন এক চাউনি দিলেন যেন শুভ্রাংশু একটা বিপজ্জনক আন্তর্জাতিক ষড়যন্ত্রকারী। তিনি চশমাটা নাকের ডগায় নামিয়ে বললেন, 'তুই তো মূর্খ! তুই রবি ঠাকুরের সেই বিখ্যাত পঙক্তি শুনবি? যেখানে তিনি বলেছিলেন—ওরে অবোধ, কুসুমের গতিতেই নির্ধারিত হয় ভবিতব্য! কবিগুরু ডিম নিয়ে লেখেননি ঠিকই, কিন্তু ভাবার্থটা তো এক!' বড়মামার এই এক অদ্ভুত স্বভাব—যে কোনো যুক্তির শেষে রবীন্দ্রনাথের নামে স্বরচিত কবিতা গুঁজে দেওয়া।

ঠিক এই সময় ময়না বুজি এক কাপ ধোঁয়া ওঠা আদা চা আর একটা ভিজে নীল খাম নিয়ে ঘরে ঢুকল। ময়না বুজির বয়স ষাটের কোঠায়, পানের রসে দাঁত লাল। সে খামটা শুভ্রাংশুর দিকে এগিয়ে দিয়ে বলল, 'ছোট মিয়া, নিচে একটা রিকশাওয়ালা ছাতি মাথায় দিয়া খাড়ায়া ছিল। কইল আপনেরে এই চিঠিটা দিয়া যাইতে। কইছে, উত্তর নাকি লাগব না।' নীল খামটা দেখেই শুভ্রাংশুর বুকের ভেতরটা কেমন যেন ছলাৎ করে উঠল। এমন ঘন নীল খাম এই ঢাকা শহরে কেবল একজনই ব্যবহার করত—কুহু। খামের গায়ে তার সেই পরিচিত গোল গোল টানা হাতের লেখা: 'শুভ্রাংশু, যার ছাতা নেই অথচ যে বৃষ্টিতে ভিজতে ভয় পায়।'

বড়মামা ডিম ছেড়ে এক লাফে শুভ্রাংশুর সামনে এসে দাঁড়ালেন। 'কার চিঠি রে শুভ্র? কোনো সাহিত্য পত্রিকা? আমার সেই প্রবন্ধটা কি ওরা ছাপল—'বৃষ্টির দিনে চায়ের কাপে চিনির অণুর মানসিক বিশৃঙ্খলা'? নাকি অন্য কিছু?' শুভ্রাংশু চিঠিটা চট করে পকেটে গুঁজে বলল, 'মামা, এটা একটা দরখাস্ত।' মামা নাক কুঁচকে বললেন, 'দরখাস্ত তো সাদা কাগজে হয় রে বোকা, নীল কাগজে তো কেবল প্রেমের চিঠি অথবা ফাঁসির হুকুম আসে। যাক গে, চা ঠান্ডা হয়ে গেলে তা আর চা থাকে না, এক ধরনের বিষাক্ত ক্বাথ হয়ে দাঁড়ায়। দুনিয়ার অর্ধেক সংসার ভেঙেছে ঠান্ডা চা খাওয়ার অপরাধে! তুই চা শেষ করে আমাকে বিশটা টাকা ধার দে তো। কদমতলীর মোড়ে গিয়ে তামাক আনতে হবে।' শুভ্রাংশু পকেট হাতড়ে দুটো দশ টাকার ভিজে নোট মামার হাতে দিয়ে ছাতা না নিয়েই বেরিয়ে পড়ল।

সিঁড়ি দিয়ে নামতেই বৃষ্টির গর্জন স্পষ্ট হলো। যেন আকাশের সমস্ত মেঘ আজ ঢাকা শহরের ওপর তাদের বুক খালি করে দেবে বলে শপথ করেছে। গলির মুখে কদমতলীর সোবহান মিয়া রিকশার হুড তুলে বসে বিড়ি ফুঁকছিল। শুভ্রাংশুকে দেখে সে একগাল হেসে বলল, 'আইসেন মামা! আপনার লাইগাই তো বইয়া আছি। আইজকা যে বৃষ্টি নামছে, আইজকা কোনো ভালো মানুষ ঘরে বইয়া থাকতে পারে না। খালি চোর আর কবিরা এই দিনে পথে নামে।' শুভ্রাংশু রিকশায় উঠে বসল। সোবহান মিয়া প্যাডেলে চাপ দিল। প্যাডেলের ক্যাঁচক্যাঁচ শব্দ আর টিনের চালে বৃষ্টির রিমঝিম শব্দ মিলে মিশে এক অদ্ভুত সুর তৈরি করল।

রিকশার কালো রেক্সিনের হুডের নিচে বসে শুভ্রাংশু কাঁপাকাঁপা হাতে নীল খামটা খুলল। খামের ভেতর থেকে শুকিয়ে যাওয়া কদম ফুলের দুটো পাপড়ি ঝরে তার কোলের ওপর পড়ল। আর বেরিয়ে এলো দুটি পাতার চিঠি। চিঠির প্রথম লাইনটা পড়েই শুভ্রাংশুর চোখ ঝাপসা হয়ে এলো। কুহু লিখেছে: 'শুভ্রাংশু, তুমি যখন এই চিঠিটা পড়বে তখন হয়তো আমি আর তোমাদের এই কোলাহলমুখর ঢাকা শহরে নেই। বাবা আমাকে কাল রাতেই খুলনার স্টিমারে তুলে দিচ্ছেন। আমার বিয়ে ঠিক হয়েছে। ছেলে সরকারি কলেজের রসায়নের অধ্যাপক। খুব ভালো মানুষ, সিগারেট খান না, অপ্রয়োজনে হাসেন না, আর বৃষ্টি হলে ঘরের সব জানালা বন্ধ করে দেন।'

চিঠির পরের প্যারাটায় কুহু লিখেছে: 'তুমি কি মনে করতে পারো শুভ্রাংশু? সেই যে গত বছর শ্রাবণের বিকেলে তুমি আমাকে বলেছিলে—কুহু, মানুষ যখন খুব হাসে তখন নাকি তার বুকের ভেতরের একটা পাখি কেঁদে মরে? আমি কাল সারারাত আয়নার সামনে দাঁড়িয়ে প্রাণপণে হেসেছি। বিশ্বাস করো, আমার বুকের ভেতরের পাখিটা কিন্তু একটুও কাঁদেনি; সে মরে কাঠ হয়ে গেছে। আমার শুধু একবার তোমার ওই বোকা বড়মামার খ্যাপাটে কথাগুলো শুনতে ইচ্ছে করছিল। আর খুব ইচ্ছে করছিল তোমার রিকশায় ভিজে ভিজে নিউমার্কেটের মোড়ে গিয়ে সস্তা কাচের লাল চুড়ি কিনতে। তুমি তো জানো, আমার হাতটা বড্ড খালি।' চিঠির শেষটায় চোখের জলের শুকনো দাগ স্পষ্ট হয়ে লেপ্টে আছে কালির ওপর।

সোবহান মিয়া রিকশা চালাতে চালাতে হঠাৎ পেছন ফিরে বলল, 'মামা, কানতেছেন নাকি? আফনের গাল বাইয়া পানি পড়তেছে তো!' শুভ্রাংশু তাড়াতাড়ি চোখ মুছে মলিন হাসল। 'না রে সোবহান, বৃষ্টির ছাঁট লেগেছে।' সোবহান মিয়া এক মুহূর্ত তার দিকে তাকিয়ে রইল। তারপর বিজ্ঞের মতো একটা দীর্ঘশ্বাস ফেলে বলল, 'হ মামা, বৃষ্টির দিনে কানলে এই এক সুবিধা। খোদার দুনিয়ায় কেউ টের পায় না কোন চোখের পানি আর কোন আকাশের বৃষ্টি। দুঃখ জিনিসটা হইলো বৃষ্টির মতো বাজান—জোর কইরা থামানো যায় না, ভিজ্যা ভিজ্যাই শেষ করতে হয়।' রিকশাটা কদমতলীর মোড় পার হয়ে ধানমন্ডির নির্জন লেকের দিকে এগোতে লাগল। আকাশ ভেঙে তখন জল নামছে, যেন এই পৃথিবীর কোনো শোকই আর অপ্রকাশিত থাকবে না।

    title: "শ্রাবণের সন্ধেবেলায় (দ্বিতীয় পর্ব)",
    date: "৪ নভেম্বর ২০২৬",
    text: `সন্ধ্যা নামার আগেই সারা শহরের বিদ্যুৎ চলে গেল। লোডশেডিংয়ের এই এক মহিমা—বিদ্যুৎ চলে গেলেই ঢাকা শহরের মানুষের আভিজাত্য খসে পড়ে। বড় বড় দালানকোঠাগুলো হঠাৎ ভূতুড়ে অন্ধকার হয়ে যায়, আর মোড়ের চায়ের দোকানগুলোতে কেরোসিনের কুপির হলুদ শিখা টিমটিম করে জ্বলে ওঠে। শুভ্রাংশু যখন ভিজে একাকার হয়ে বাড়ি ফিরল, তখন বারান্দায় দাঁড়িয়ে বড়মামা আকাশের দিকে মুখ তুলে কী যেন বিড়বিড় করছিলেন। তাঁর হাতে একটা পুরানো রিভলভারের খাপের মতো চামড়ার খোলস, কিন্তু খোলসের ভেতর কোনো অস্ত্র নেই; আছে একটা মরচে পড়া সাইকেলের ঘণ্টি।

শুভ্রাংশু ভেজা চটিটা দরজার কাছে খুলতেই বড়মামা পেছনে না তাকিয়েই বললেন, 'শব্দ শুনলেই আমি বুঝতে পারি আগন্তুক পাপী না পুণ্যবান। তোর পায়ের চটি দিয়ে যে চপচপ আওয়াজ হচ্ছে, এতে স্পষ্টভাবে প্রমাণিত হয় তুই জীবনে কোনো কঠিন সিদ্ধান্ত নিতে পারিসনি। সিদ্ধান্তহীন মানুষের পায়ের আওয়াজে কোনো ছন্দ থাকে না।' শুভ্রাংশু কোনো উত্তর দিল না। সে গামছা দিয়ে মাথা মুছতে লাগল। মামা এবার ঘুরে দাঁড়িয়ে হারিকেনের আলো তার মুখের ওপর ফেললেন। 'তোর চোখ দুটো এত লাল কেন রে? তুই কি গাঁজা খাওয়া শুরু করেছিস? নাকি কদমতলীর সোবহান মিয়ার সঙ্গে বসে বিড়ির ধোঁয়া টেনেছিস?'

'না মামা, চোখে পোকা পড়েছিল।' শুভ্রাংশু মৃদু গলায় বলল। বড়মামা অবিশ্বাসের ভঙ্গিতে মাথা নাড়লেন। 'পোকা কেবল বোকা মানুষের চোখেই পড়ে। বিজ্ঞ মানুষের চোখে পোকা ঢুকতে পারে না, কারণ তাদের দৃষ্টিশক্তি প্রখর। শোন শুভ্র, তুই যখন বাইরে ছিলি তখন সদরঘাট থেকে একটা লোক এসেছিল। কুহুর মামার বাড়ির কাজের ছেলে কাসেম। সে তোর নামে একটা প্যাকেট রেখে গেছে।' শুভ্রাংশুর হাত থেমে গেল। 'প্যাকেট? কী প্যাকেট মামা?' বড়মামা তাচ্ছিল্যের সঙ্গে ঘরের মেঝের দিকে আঙুল নির্দেশ করলেন। সেখানে খবরের কাগজে মোড়ানো একটা ছোট্ট চৌকো বাক্স পড়ে আছে।

বড়মামা বললেন, 'আমি প্যাকেটটা ওজন করে দেখেছি। আনুমানিক তিনশত পঞ্চাশ গ্রাম। এর ভেতর বিস্ফোরক থাকার সম্ভাবনা শূন্যের কোঠায়, তবে মানসিক বিস্ফোরক থাকতে পারে। তোর মামী যখন আমাকে ছেড়ে চলে যায়, তখনো ঠিক এই ওজনের একটা প্যাকেট পাঠিয়েছিল। প্যাকেটে ছিল একজোড়া আধভাঙা চীনামাটির কাপ আর একটা তিন ব্যাটারির টর্চলাইট। টর্চলাইটটার অর্থ ছিল—তিনি আশা করেন আমার অন্ধকার ভবিষ্যৎ যেন কিছুটা আলোকিত হয়! হা হা হা!' বড়মামা এক অদ্ভুত শুকনো হাসি হাসলেন। সেই হাসির শব্দে সারা ঘরে এক হিমশীতল শূন্যতা ছড়িয়ে পড়ল। শুভ্রাংশু জানে, বড়মামার এই অট্টহাসিটাই আসলে তাঁর কান্না। পঁচিশ বছর আগে মামী অন্য এক ধনী ব্যবসায়ীর হাত ধরে চলে যাওয়ার পর মামা কোনোদিন একফোঁটা চোখের জল ফেলেননি; কেবল এমন অট্টহাসি হেসে ঘরের জানালার কপাট বন্ধ করে দিতেন।

শুভ্রাংশু প্যাকেটটা তুলে নিয়ে তার ঘরে গেল। মোমবাতি জ্বালিয়ে খবরের কাগজের বাঁধন খুলতেই বেরিয়ে এলো এক ডজন কাচের লাল রেশমি চুড়ি। আর তার নিচে ভাঁজ করা একটা ছোট্ট চিরকুট। তাতে কাঁপাকাঁপা অক্ষরে লেখা: 'শুভ্রাংশু, আজ বিকেলে খুলনার লঞ্চে ওঠার আগে আমি এক ফেরিওয়ালার কাছ থেকে চুড়িগুলো কিনেছি। তুমি তো কোনোদিন আমাকে কিছু কিনে দিলে না। আজ আমার টাকায় কেনা চুড়িগুলো তোমাকে দিয়ে গেলাম। তুমি কোনো এক শ্রাবণের রাতে যখন অন্য কারও হাত ধরবে, তখন তাকে এই চুড়িগুলো পরিয়ে দিয়ো। আর বোলো—এক পাগল মেয়ে এগুলো দিয়ে এক জন্ম ঋণ শোধ করে গেছে।'

চুড়িগুলো হাতে নিয়ে শুভ্রাংশুর মনে হলো, কাচের চুড়িগুলো যেন বরফের মতো ঠান্ডা। প্রতিটি চুড়ির গায়ে আলো লেগে এক রক্তিম আভা ছড়িয়ে পড়ছে। ঠিক এই সময় রান্নাঘর থেকে ইলিশ মাছ ভাজার গন্ধ আর তেল ছিটকানোর শব্দ এলো। ময়না বুজি মোমবাতির আলোয় কাঠের পিঁড়িতে বসে রাতের রান্না চড়িয়েছে। শুভ্রাংশু রান্নাঘরের চৌকাঠে গিয়ে দাঁড়াল। ময়না বুজি তাকে দেখে আঁচলে হাত মুছে বলল, 'ছোট মিয়া, শরীরটা ভিজাইয়া আসছ। ঠাণ্ডা লাগব তো। এক বাটি গরম ভাতের ফ্যান খাইয়া লও।' শুভ্রাংশু বলল, 'বুজি, মানুষ মানুষকে ছেড়ে যায় কেন বলতে পারো?'

ময়না বুজি কড়াইয়ের মাছটা উল্টে দিয়ে এক মুহূর্ত চুপ করে রইল। চুলার আগুনের লালচে আলো তার বলিরেখাভরা মুখে এক বিষাদময় ছায়া ফেলেছে। সে একটা গভীর নিঃশ্বাস ফেলে বলল, 'ছোট মিয়া, নদী যখন সাগরে যায়, তখন কি তার ইচ্ছা থাকে চরের বালুরে ছাইড়া যাইতে? জোয়ারের টানে যাইতে হয়। কুহু মাইয়াডা রাজকন্যার লাহান। তার বাপে গরিব কেরানি। বড় ঘরে বিয়া না দিলে তার ভাতের হাড়িতে চাল জুটব না। তুমি অইলা বাউণ্ডুলে মানুষ। আইজ এইখানে তো কাইল ওইখানে। মাইয়া মাইনষের জীবন হইলো লতার লাহান, শক্ত খুঁটি না পাইলে বাঁচে না। তুমি তো নিজেই খুঁটি ছাড়া নাওয়ের মতো ভাসতেছ।' ময়না বুজির এই সহজ সত্যটা তীরের ফলার মতো শুভ্রাংশুর বুকে গিয়ে বিঁধল।

রাত তখন বারোটা। বাইরে বৃষ্টির বেগ কিছুটা কমে ঝিরঝিরে বৃষ্টিতে রূপ নিয়েছে। বড়মামা তাঁর পড়ার ঘরে বসে টেপরেকর্ডারে একটা পুরোনো ক্যাসেট বাজাতে শুরু করেছেন। আব্বাসউদ্দিনের কণ্ঠে বিরহী গান—'নাও ছাড়িয়া দে... পাল উড়াইয়া দে...'। গানের করুণ সুর পুরো বাড়ির বাতাসে ভারী হয়ে ভাসছে। শুভ্রাংশু তার বিছানায় শুয়ে সিলিংয়ের দিকে তাকিয়ে রইল। জানালার কার্নিশ থেকে টুপটুপ করে জল পড়ার শব্দ ছাড়া পৃথিবীতে আর কোনো শব্দ নেই। হঠাৎ বড়মামার ঘরের দিক থেকে কাচ ভাঙার মৃদু শব্দ এলো। শুভ্রাংশু দ্রুত উঠে গিয়ে দেখল, বড়মামা তাঁর টেবিলে রাখা ডিমের খোসাগুলো চূর্ণবিচূর্ণ করে ফেলেছেন। তাঁর চোখের কোণ দিয়ে গড়িয়ে পড়া দুটো জলের ফোঁটা হারিকেনের আলোয় মুক্তোর দানার মতো জ্বলছে।

শুভ্রাংশু দরজায় দাঁড়িয়ে বলল, 'মামা, তুমি কাঁদছ?' বড়মামা চট করে চোখ মুছে টেবিলের ওপর সজোরে থাবা বসালেন। 'কে কাঁদে? কোন হতভাগা কাঁদে? তোর মাথায় কি ঘিলু নেই শুভ্র? আমি কান্না করব কোন দুঃখে! হারিকেনের চিমনি থেকে অতিরিক্ত কার্বন ডাই-অক্সাইড বের হচ্ছে, সেই ধোঁয়ায় চোখে জল এসে গেছে। তুই বরং যা, কাল সকালের প্রথম ট্রেনের টিকিট কাটবি। আমরা একবার কুষ্টিয়ায় যাব। সেখানে এক লালন ফকিরের মাজারে গিয়ে তোর এই মস্তিষ্কের বিকার সারিয়ে আনব।' বড়মামা জোর করে হাসার চেষ্টা করলেন, কিন্তু তাঁর ঠোঁটের কোণ থরথর করে কাঁপতে লাগল। শুভ্রাংশু বুঝল, আজ রাতে এই বাড়িতে কেউ ঘুমোবে না—না সে, না তার বড়মামা, না জানালার বাইরে কান পেতে থাকা শ্রাবণের রাত।

    text: `পরদিন সকালে বৃষ্টি থামল বটে, কিন্তু আকাশ থেকে মেঘ কাটল না। আকাশটা এমন এক থমথমে রূপ ধরে আছে যেন একটু অসাবধানে কথা বললেই সে আবার কেঁদে ফেলবে। বড়মামা সকাল থেকেই অদ্ভুত তৎপর। তিনি একটা ছেঁড়া ট্রাঙ্ক খুলে তাঁর পঁচিশ বছর আগের একটা খয়েরি রঙের কোট বের করেছেন। কোটের দুটো বোতাম নেই, একপাশে সামান্য উইপোকার কামড়। তিনি আয়নার সামনে দাঁড়িয়ে সেই কোট গায়ে দিয়ে নিজেকে গম্ভীর মুখে দেখছেন। শুভ্রাংশু চায়ের কাপ হাতে দাঁড়িয়ে দৃশ্যটা দেখছিল।

'শুভ্র, তুই কি বলতে পারিস এই কোটটা পরলে আমাকে কার মতো দেখায়? চে গুয়েভারা নাকি চার্লি চ্যাপলিন?' বড়মামা গম্ভীর মুখে প্রশ্ন করলেন। শুভ্রাংশু এক চুমুক চা দিয়ে বলল, 'মামা, আপনাকে ঠিক চার্লি চ্যাপলিনের বড় ভাই চার্লস চ্যাপলিনের মতো দেখায়, যে কিনা কোনো এক ভুল ধারণার বশে কুষ্টিয়ার ম্যাজিস্ট্রেট হতে চেয়েছিল।' বড়মামা রেগে গিয়ে বললেন, 'তুই একটা রসকষহীন পশু! এই কোট পরে আমি যখন সত্তরের দশকে ঢাকা বিশ্ববিদ্যালয়ের আর্টস ফ্যাকাল্টি দিয়ে হেঁটে যেতাম, তখন লাইব্রেরির সামনে দাঁড়ানো অন্তত সাতজন তরুণী দীর্ঘশ্বাস ফেলেছিল। তাদের মধ্যে একজন তো আমার কোটের খসখসে শব্দ শুনে মুগ্ধ হয়ে আস্ত একটা শেক্সপিয়রের সনেট মুখস্থ করে ফেলেছিল!'

শুভ্রাংশু মুচকি হেসে বলল, 'তারপর সেই তরুণী কি আপনার মামী হয়েছিলেন?' বড়মামার মুখটা এক নিমেষে ম্লান হয়ে গেল। তিনি কোটের হাতা ঠিক করতে করতে চুপ করে গেলেন। তাঁর চোখের দৃষ্টি হঠাৎ দূর অতীতে হারিয়ে গেল। তিনি খুব নিচু স্বরে বললেন, 'না রে শুভ্র। সে মামী হয়নি। সে চলে গিয়েছিল আরেকজনের সাথে, যার কোটে তিনটা বোতাম ছিল আর একটা ভক্সওয়াগন গাড়ি ছিল। মেয়েরা গাড়ির পেছনের সিট খুব পছন্দ করে রে। সাইকেলের ক্যারিয়ারে ভিজতে ভিজতে প্রেম করা যায়, কিন্তু জীবন চালানো যায় না।' বড়মামার এই ক্ষণিক বিষাদটুকু শুভ্রাংশুর বুকের খাঁচায় এসে সরাসরি আঘাত করল।

শুভ্রাংশু পকেট থেকে লাল কাচের চুড়িগুলো বের করে টেবিলের ওপর রাখল। বারোটা চুড়ির গায়ে সকালের নরম আলো পড়ে চিকচিক করছে। বড়মামা চুড়িগুলোর দিকে তাকালেন। তারপর তাঁর দীর্ঘ শীর্ণ আঙুল দিয়ে একটা চুড়ি স্পর্শ করলেন। 'চুড়িগুলো খুব সস্তা রে শুভ্র। ফুটপাত থেকে দশ টাকায় কেনা। কিন্তু জানিস, দুনিয়ার সবচেয়ে দামি জিনিসের কোনো মূল্যতালিকা থাকে না। তোর মামী যেদিন চলে যায়, সেদিন আমার ড্রয়ারে একটা সবুজ কাচের চুড়ি ফেলে গিয়েছিল। আমি চুড়িটা ভাঙিনি। আজ পঁচিশ বছর ধরে ওটা আমার বালিশের নিচে রাখা আছে। মাঝে মাঝে ঘুমের ঘোরে হাত লাগলে মনে হয়—কেউ একজন যেন এখনো পাশে শুয়ে আছে।'

বড়মামার এই স্বীকারোক্তি শুনে শুভ্রাংশু স্তব্ধ হয়ে গেল। যে খ্যাপাটে খিটখিটে মানুষটাকে সে সারাজীবন শুধু পাগলামি করতে দেখেছে, সেই মানুষের বুকের ভেতর এমন এক মহাসমুদ্রের মতো হাহাকার লুকানো আছে তা সে কোনোদিন কল্পনাও করেনি। শুভ্রাংশু বলল, 'মামা, তুমি কুহুর বিয়ের খবরটা জানো?' বড়মামা জানালার দিকে মুখ ঘুরিয়ে নিলেন। 'আমি জানব না মানে? আমি কি অন্ধ? কুহুর বাপ কাল রাতে আমার কাছে এসেছিল পাঁচ হাজার টাকা ধার চাইতে। বরের যৌতুক দিতে হবে। রেফ্রিজারেটর কেনার টাকা নেই। আমি তাকে আমার জমানো পেনশনের পুরো টাকাটা দিয়ে দিয়েছি।'

শুভ্রাংশুর চোখ বড় বড় হয়ে গেল। 'মামা! তোমার পেনশনের টাকা? তুমি তো ওই টাকা দিয়ে সুন্দরবনের মধু আর বই কেনার পরিকল্পনা করছিলে!' বড়মামা একটু অদ্ভুতভাবে হাসলেন। 'মধু খেয়ে কী হবে রে শুভ্র? মুখের তেতো স্বাদ কি সুন্দরবনের মধুতে যায়? কুহু মেয়েটা বড় ভালো। ছোটবেলায় যখন এই বাড়িতে আসত, তখন আমার এই পাকা দাড়ি ধরে টান দিয়ে বলত—মামা, তুমি এত বুড়ো হলে কেন? আমি তাকে বলতাম—তোর মতো রাজকন্যাকে কোলে নেওয়ার জন্য। সেই মেয়েটার শ্বশুরবাড়িতে গিয়ে যেন মাথা নিচু না হয়। তবে আমি ওর বাপকে একটা কথা বলে দিয়েছি।' 'কী কথা মামা?' 'বলেছি, জামাই যদি কোনোদিন কুহুর চোখের কোণে জল আনে, তবে আমি নিজে গিয়ে তাঁর ল্যাবরেটরির সব টেস্টটিউব ভেঙে দিয়ে আসব!'

বড়মামার এই অদ্ভুত রসিকতায় শুভ্রাংশুর একাধারে হাসি পেল এবং চোখ উপচে জল চলে এলো। সে কোনো কথা বলতে পারল না। দুপুরবেলা যখন সে কদমতলীর মোড়ে গেল, সেখানে সোবহান মিয়া তার রিকশা নিয়ে দাঁড়িয়ে ছিল। কদম গাছের নিচে ছড়িয়ে ছিটিয়ে পড়ে আছে অজস্র হলুদ পাপড়ি। বাতাসটা ভারী হয়ে আছে। সোবহান মিয়া শুভ্রাংশুকে দেখে বলল, 'মামা, কালকের চিঠিটার উত্তর লেইখা ফালাইছেন?' শুভ্রাংশু আকাশের দিকে তাকিয়ে মাথা নাড়ল। 'না রে সোবহান। কিছু চিঠির কোনো উত্তর হয় না। মৌনতাই তাদের একমাত্র উত্তর।'

সোবহান মিয়া মাটিতে থুতু ফেলে বলল, 'ভুল করলেন মামা। মানুষ যখন চইলা যায়, তখন এক ফোঁটা ডাক দিলে হয়তো সে ফিরা তাকায়। ডাক না দিলে সে মনে করে তারে কেউ চায় নাই। ডাকতে হয় মামা, বুক ফাইট্যা গেলেও ডাকতে হয়।' শুভ্রাংশু পকেটে হাত দিয়ে কুহুর সেই লাল চুড়িগুলো ছুঁয়ে দেখল। তার মনে হলো, ঢাকা শহরটা কত বড়, কত লক্ষ কোটি মানুষ এখানে বাস করে; অথচ একটা মানুষের চলে যাওয়াতেই পুরো শহরটা কেমন বিরান মরুভূমির মতো খাঁ খাঁ করছে। রিকশার চাকায় কদমফুলগুলো পিষ্ট হতে লাগল, আর শুভ্রাংশুর চোখের পাতায় জমে থাকা জল অবশেষে বৃষ্টির মতো টপটপ করে ঝরে পড়ল তার পাঞ্জাবির বুকে।

    text: `কমলাপুর রেলস্টেশনের তিন নম্বর প্ল্যাটফর্মে যখন খুলনাগামী 'চিত্রা এক্সপ্রেস' এসে থামল, তখন রাত ন'টা বেজে কুড়ি মিনিট। প্ল্যাটফর্মের বাতিগুলো যেন ইচ্ছাকৃতভাবেই অনুজ্জ্বল। গুঁড়ি গুঁড়ি বৃষ্টি প্ল্যাটফর্মের টিনের শেডের ওপর এক অবিশ্রান্ত নূপুরের নিক্বণ বাজিয়ে চলেছে। মানুষের ভিড়, কুলিদের হাঁকডাক, চা-ওয়ালার ধাতব কেটলির টুংটাং শব্দ—সব মিলিয়ে এক অদ্ভুত মায়াবী অস্থিরতা। শুভ্রাংশু দাঁড়িয়ে ছিল একটা সিমেন্টের পিলারের আড়ালে। তার পাশে বড়মামা মোবারক হোসেন, তাঁর সেই বোতামহীন খয়েরি কোট গায়ে, আর হাতে কাগজের ঠোঙায় চারটা গরম শিঙাড়া।

বড়মামা একটা শিঙাড়ায় কামড় দিয়ে বললেন, 'শুভ্র, এই শিঙাড়াটার আলুর ভেতর ধনেপাতার পরিমাণ প্রয়োজনের চেয়ে শতকরা পনেরো ভাগ বেশি। বাঙালি জাতির কোনো কিছুতেই পরিমিতিবোধ নেই। যখন ভালোবাসে তখন অন্ধের মতো ভালোবাসে, আর যখন অবহেলা করে তখন আস্তাকুঁড়ে ফেলে দেয়। তুই তো শিঙাড়া খাবি না, তুই তো এখন দেবদাসের তৃতীয় খণ্ড অভিনয় করছিস। এই নে, একটা খেয়ে দেখ, পেটের ভেতর আগুন জ্বললে বুকের আগুন কিছুটা কমে।' শুভ্রাংশু মলিন হাসল। তার চোখ প্ল্যাটফর্মের ভিড় ঠেলে 'খ' বগির দিকে নিবদ্ধ। সেখানে কুহু দাঁড়িয়ে আছে তার বাবার হাত ধরে।

কুহুর পরনে একটা হালকা ফিরোজা রঙের তাঁতের শাড়ি। মাথার ঘোমটা কিছুটা টানা, কিন্তু সেই চেনা উজ্জ্বল মুখটি লুকোনো যায়নি। তার মুখে কোনো প্রসাধন নেই, কেবল চোখের নিচে এক গাঢ় ক্লান্তির ছায়া। তার পাশে দাঁড়িয়ে থাকা বাবা—একজন শীর্ণকায় বৃদ্ধ ভদ্রলোক—হাতজোড় করে ট্রেনের টিটিকে কী যেন অনুরোধ করছেন। কুহু হঠাৎ প্ল্যাটফর্মের ভিড়ের দিকে চোখ ফেরাল। যেন তার ষষ্ঠেন্দ্রিয় তাকে জানান দিচ্ছে যে এই চত্বরে কোথাও এমন একজন মানুষ দাঁড়িয়ে আছে যার কোনো অস্তিত্ব থাকার কথা ছিল না। শুভ্রাংশু পিলারের পেছনে সরে যেতে চাইল, কিন্তু পারল না। তার পা যেন প্ল্যাটফর্মের কাদামাটিতে আটকে গেছে।

ঠিক এই সময় ট্রেনের প্রথম সতর্কবার্তা বাজল—এক দীর্ঘ ভেঁপু। সেই ভেঁপ্পুর শব্দে প্ল্যাটফর্মের বাতাস কেঁপে উঠল। বড়মামা শিঙাড়ার ঠোঙাটা শুভ্রাংশুর হাতে ধরিয়ে দিয়ে বললেন, 'তুই তো একটা অপদার্থ! সারা জীবন খালি পিলারের পেছনে দাঁড়িয়ে উঁকিঝুঁকি মারলি। শোন, তোর বাপও তোর বয়সে এমন ভিতু ছিল। তোর মাকে প্রস্তাব দিতে গিয়ে তিনবার মূর্ছা গিয়েছিল। শেষ পর্যন্ত আমি গিয়ে তোর নানাকে বলেছিলাম—আপনার মেয়েকে যদি আমার এই ভেড়া ভাইয়ের সাথে বিয়ে না দেন, তবে আমি আপনাদের পুকুরের সব মাছ বিষ দিয়ে মেরে ফেলব! তখন বিয়ে হয়েছিল। তুই যদি এখন না যাস, তবে আমি গিয়ে কুহুর হবু বরকে একটা বেনামী চিঠি পাঠিয়ে দেব যে তোর সাথে কুহুর একটা প্রাচীন রোমান্টিক মামলা চলছে!'

শুভ্রাংশু বড়মামার দিকে তাকাল। মামার চোখ দুটো হারিকেনের আলোর মতোই তীব্র জ্বলছে। শুভ্রাংশু পকেট থেকে সেই লাল কাচের চুড়ির প্যাকেটটা শক্ত করে মুঠোর ভেতর নিল। তারপর ধীরপায়ে ভিড় ঠেলে এগিয়ে গেল বগির দিকে। কুহু তখন ট্রেনের দরজার হাতল ধরে ওপরে উঠতে যাচ্ছে। শুভ্রাংশুর গলার স্বর ফুটল না, সে কেবল আস্তে করে ডাকল—'কুহু।' শব্দটা এত ক্ষীণ ছিল যে ট্রেনের ইঞ্জিনের গর্জনে তা হারিয়ে যাওয়ার কথা। কিন্তু আশ্চর্যের বিষয়, কুহু সঙ্গে সঙ্গে ঘুরে তাকাল। তার চোখের দৃষ্টি শুভ্রাংশুর ওপর পড়তেই তার সমস্ত শরীর যেন এক মুহূর্তে পাথর হয়ে গেল।

কুহু এক পা নেমে এলো প্ল্যাটফর্মে। তার বাবার চোখ তখন অন্য দিকে। কুহু খুব কাছে এসে ফিসফিস করে বলল, 'তুমি এলে কেন শুভ্রাংশু? আমি তো তোমাকে আসতে বারণ করেছিলাম।' শুভ্রাংশু তার মুখের দিকে তাকিয়ে রইল। তার মনে হলো, পৃথিবীতে কোটি কোটি শব্দ আছে, কিন্তু এই মুহূর্তে উচ্চারণ করার মতো একটি শব্দও তার জানা নেই। সে শুধু তার হাতের মুঠিটা খুলে ধরল। লাল কাচের চুড়িগুলো প্ল্যাটফর্মের নিভু নিভু আলোয় রক্তবিন্দুর মতো জ্বলজ্বল করছে। কুহুর ঠোঁট কেঁপে উঠল। তার চোখ দুটো জলে টলমল করতে লাগল।

'তুমি এগুলো রেখে দিলে না কেন?' কুহু কাঁদতে কাঁদতে বলল। 'এগুলো দিয়ে তোমার কোনো অধিকার নেই আমাকে দুর্বল করার।' শুভ্রাংশু ধরা গলায় বলল, 'অধিকার নিয়ে তো মানুষ বাঁচে না কুহু। মানুষ বাঁচে কিছু অপূর্ণতা নিয়ে। তুমি বলেছিলে না, তোমার হাতটা বড্ড খালি? আমি শুধু দেখতে এসেছি তোমার হাতটা সত্যি খালি কি না।' কুহু হঠাৎ তার দুই হাত দিয়ে শুভ্রাংশুর ডান হাতটা জড়িয়ে ধরল। সেই স্পর্শে এক মুহূর্তের জন্য যেন সময় থেমে গেল। ট্রেনের ইঞ্জিন তখন শেষ বাঁশি বাজিয়ে মৃদু ঝাঁকুনি দিয়ে চলতে শুরু করেছে।

কুহুর বাবা চিৎকার করে উঠলেন, 'কুহু! মা রে, ট্রেন ছেড়ে দিল! জলদি ওঠ!' কুহু এক ঝটকায় হাত ছাড়িয়ে ট্রেনের হাতল ধরল। ট্রেনের চাকা ঘুরতে লাগল। শুভ্রাংশু ট্রেনের সাথে সাথে হাঁটতে লাগল, তারপর দৌড়াতে লাগল। কুহু দরজায় দাঁড়িয়ে অশ্রুভেজা মুখে হাত নাড়ল। তার খোলা চুল ট্রেনের বাতাসে উড়ছিল। ট্রেনের গতি বাড়ল। প্ল্যাটফর্মের শেষ মাথায় এসে শুভ্রাংশুর দৌড় থামল। ট্রেনটি রাতের অন্ধকারের ভেতর একরাশ লাল আলো জ্বালিয়ে দূরে মিলিয়ে গেল, পেছনে রেখে গেল শুধুই নিঃসীম শূন্যতা আর লোহার লাইনের ওপর ঝরে পড়া গুঁড়ি গুঁড়ি বৃষ্টি।

শুভ্রাংশু যখন ধীরে ধীরে প্ল্যাটফর্মে ফিরে এলো, তখন বড়মামা একটি কাঠের বেঞ্চে বসে শেষ শিঙাড়াটা চিবোচ্ছেন। প্ল্যাটফর্ম এখন সম্পূর্ণ ফাঁকা, কেবল বৃষ্টির ছাঁট এসে বেঞ্চ ভিজিয়ে দিচ্ছে। বড়মামা শুভ্রাংশুর কাঁধে একটা হাত রাখলেন। সে হাতের স্পর্শটা ছিল অসম্ভব ভারী এবং স্নেহময়। বড়মামা শান্ত গলায় বললেন, 'শুভ্র, জীবনটা একটা ট্রেনের মতো। কেউ ওঠে, কেউ নামে। যে নেমে যায় তাকে ধরে রাখার সাধ্য কোনো ট্রেনের চালকেরও নেই। কিন্তু একটা কথা মনে রাখিস—ট্রেন চলে গেলেও স্টেশনটা কিন্তু থেকে যায়। সে অপেক্ষা করে পরের ট্রেনের জন্য।' শুভ্রাংশু আর নিজেকে ধরে রাখতে পারল না। সে বড়মামার বুকের ওপর মাথা রেখে শিশুর মতো ডুকরে কেঁদে উঠল। বড়মামা তাকে শক্ত করে জড়িয়ে ধরে আকাশের দিকে তাকিয়ে বললেন, 'কাঁদ শুভ্র, মন খুলে কাঁদ। বৃষ্টি তো কেবল আকাশ একা কাঁদে না, মাটিরও তো কখনো কখনো আকাশ হয়ে কাঁদতে ইচ্ছে করে।' রাতের বৃষ্টি তখন তীব্রতর হলো, আর প্ল্যাটফর্মের নিঃসঙ্গ আলোয় দুজন মানুষ বৃষ্টি আর কান্নায় একাকার হয়ে দাঁড়িয়ে রইল।

    date: "৪ নভেম্বর ২০২৬",
    text: `ভোরের ঢাকা শহরটা দেখতে অদ্ভুত লাগে। যেন একটা প্রকাণ্ড কালো বেড়াল সারা রাত বৃষ্টির পানিতে ভিজে ক্লান্ত হয়ে অলস ভঙ্গিতে গা ঝাড়া দিচ্ছে। কদমতলীর গলির মোড়ে ড্রেনের নোংরা পানি আর খসে পড়া কদম ফুলের পাপড়ি মিলেমিশে একাকার। ঘরের ভাঙা ভেন্টিলেটর দিয়ে ভেজা বাতাসের একটা ঝাপটা আসতেই শুভ্রাংশুর ঘুম ভেঙে গেল। ঘুম ভাঙার কারণ বাতাস নয়, বড়মামা মোবারক হোসেনের অতিবৈজ্ঞানিক আস্ফালন। বড়মামা তক্তপোশের ওপর উবু হয়ে বসে একটা অতি প্রাচীন, রবার ফাটা স্টেথোস্কোপ কানের মধ্যে গুঁজে গভীর মনোযোগে কী যেন শুনছেন। স্টেথোস্কোপের ধাতব চাক্তিটি পাতা রয়েছে টবের একটি আধমরা লজ্জাবতী গাছের পাতায়। শুভ্র চোখ কচলাতে কচলাতে উঠে বসতেই মামা রক্তচক্ষু নিয়ে তর্জনী তুললেন, 'চুপ! একদম নিঃশ্বাস ফেলবি না শুভ্র। মহাজাগতিক আবিষ্কারের মুখে তুই শব্দ করে সব ভণ্ডুল করে দিবি নাকি? গাছটা এইমাত্র তিনবার হাই তুলেছে। তার মানে উদ্ভিদেরও তীব্র মনোকষ্ট হয়। রবীন্দ্রনাথ যে লিখেছেন—নয়ন তোমারে পায় না দেখিতে, রয়েছ নয়নে নয়নে—এটা আসলে মানুষের জন্য লেখেননি, লিখেছেন এই লজ্জাবতীর মতো আত্মগোপনকারী ঘাসপাতাদের উদ্দেশ্যে!'

শুভ্রাংশু একটা দীর্ঘশ্বাস ফেলল। বড়মামার এই খ্যাপামি নতুন নয়। গত সপ্তাহে তিনি ডিম সেদ্ধ করার আধুনিক পদ্ধতি আবিষ্কার করতে গিয়ে রান্নাঘরের প্রিমাস স্টোভ ফাটিয়ে ময়না বুজির ভ্রু পুড়িয়ে দিয়েছিলেন। শুভ্র উদাস গলায় বলল, 'মামা, গাছ যদি হাই তোলে তবে তাকে এক কাপ চা বানিয়ে দিন। তার চেয়ে বরং বলুন ময়না বুজি নাস্তা বানিয়েছে কি না। আমার পেটের ভেতর একটা আস্ত বুনো শুয়োর চেঁচামেচি করছে।' বড়মামা ক্ষুব্ধ হয়ে স্টেথোস্কোপ কান থেকে টেনে খুলে গলায় ঝুলিয়ে রাখলেন, যেন তিনি বিলেতফেরত কোনো নামকরা উদ্ভিদ-সার্জন। তিনি চোখ পিটপিট করে বললেন, 'পেটের ক্ষুধা তো পশুদেরও থাকে রে গর্দভ! অন্তরের ক্ষুধা কয়জনের থাকে? তুই তো আজকাল জ্যান্ত লাশ হয়ে ঘুরে বেড়াচ্ছিস। কাল রাতে ট্রেনের হুইসেল শোনার পর থেকে তোর চোখের যে দশা, তাতে পরিষ্কার লেখা আছে—হৃদপিণ্ডের আর্টারিতে রক্ত নয়, বিষাদ জমছে। মানুষ হলো মহাবিশ্বের একমাত্র জীব, যে কাঁদতে কাঁদতে হাসতে পারে আবার হাসতে হাসতে গলায় চা আটকে মরতে পারে। তুই কোন ক্যাটাগরির লাশ, বল তো?'

ঠিক সেই মুহূর্তে ময়না বুজি ঘরে ঢুকল। তার হাতে একটি ভাঙা এলুমিনিয়ামের থালায় দুটো পোড়া পরোটা আর একবাটি কালচে ডাল। ময়না বুজির মুখে সবসময় বিশ্বযুদ্ধের সাইরেন বাজার মতো গম্ভীর ভাব লেগেই থাকে। থালাটা সশব্দে তক্তপোশে নামিয়ে রেখে সে খ্যানখ্যানে গলায় বলল, 'খাওয়া নিয়া এত ফটরফটর কিসের শুনি? কেরোসিন নাই ঘরে, কাঠ ভিইজ্যা ঢোল হইয়া আছে, এর মইধ্যে পরোটা সেঁকছি এই ঢের ভাগ্যি! আর ছোটন সাব, আপনেরে নিচে এক রিকশাঅলা ডাকতাছে। গাট্টিবোচকা না কী জানি আনছে, খালি কয়—শুভ্র ভাইয়ের দরকারি জিনিস!' শুভ্রর বুকটা আচমকা ধক করে উঠল। রিকশাঅলা? সোবহান মিয়া নয় তো? সে কাল শেষ রাতে কুহুকে নিয়ে তেজগাঁও স্টেশন থেকে অজানা ঠিকানায় উধাও হয়েছিল। শুভ্র চটি জোড়া পায়ে গলিয়ে এক লাফে ঘর থেকে বেরিয়ে সিঁড়ি ভেঙে নিচে নেমে গেল। বড়মামা পেছন থেকে হাঁকলেন, 'সাবধানে নামিস শুভ্র! মহাকর্ষ বল কিন্তু তোকে চেনে না, পা পিছলে পড়লে কোমরটাই আগে ফসকে যাবে!'

নিচে স্যাঁতসেঁতে প্যাসেজের মুখে দাঁড়িয়ে ছিল সোবহান মিয়া। তার নীল রঙের ডোরাকাটা লুঙ্গিটা হাঁটু পর্যন্ত গোটানো, মাথায় ভেজা গামছা প্যাঁচানো। বৃষ্টির অবিশ্রান্ত ধারায় তার সারা শরীর ধুয়ে যাচ্ছে, অথচ সে নির্বিকার মুখে একটা সিগারেট টানার ব্যর্থ চেষ্টা করছে ভিজে যাওয়া দেশলাই কাঠি ঠুকে। শুভ্রকে দেখেই সোবহান ফোকলা দাঁতে এক চিলতে হাসি ফুটিয়ে বলল, 'ছোটভাই! আফনেরে খুঁজতে যাইয়া আমার জানডা খ্যাতা হইয়া গেল। কুহু আপামণি কাল রাইতে ট্রেন ছাড়ার ঠিক আগমুহূর্তে আমার কানমলা দিয়া এইডা দিল। কইলো—সোবহান ভাই, যদি শুভ্রর হাতে এইডা না পৌঁচাও, তাইলে আমার বিয়ার আসরে আফনের রিকশার তিনডা চাকাই ব্লাস্ট হইয়া যাইব! নেন, আপামণির আমানত।' সোবহান তার ময়লা ফতুয়ার বুকপকেট থেকে সাবধানে পলিথিনে মোড়ানো একটি নীল রঙের খাম বের করল। খামটার ওপরের কোণটা সামান্য ভেজা, কিন্তু তার ওপর গোটা গোটা অক্ষরে লেখা—'হতভাগা শুভ্রর নিকট'—চিঠির হস্তাক্ষর দেখতেই শুভ্রর চোখের সামনে পুরো শ্রাবণের আকাশ যেন দুলতে লাগল।

সোবহান মিয়া শুভ্রর মুখের ফ্যাকাসে রঙের দিকে তাকিয়ে অভিজ্ঞ দার্শনিকের মতো একগাল ধোঁয়া ছেড়ে বলল, 'ছোটভাই, মনের কষ্ট হইলো রিকশার পিছনের চাকার পাংচার। বাতাস যতই ভরেন, গোঁ গোঁ শব্দ কইরা আবার মাটির লগে মিশ্যা যাইবো। আপামণি ট্রেনের জানালার পাশে বইসা সারারাত কাঁদছে, আমি জানালা দিয়া দেখছি। মাইয়া মাইনষের কান্দন বড় খারাপ জিনিস ভাই, তামাম দুনিয়া ভাইস্যা যায়।' সোবহান রিকশার প্যাডেল চেপে প্যাঁচপ্যাঁচে কাদার মধ্যে চলে গেল। শুভ্র দাঁড়িয়ে রইল একা। নীল খামটি হাতে নিয়ে তার মনে হলো, এটি কোনো সাধারণ কাগজের টুকরো নয়, এ যেন এক টুকরো উত্তপ্ত অঙ্গার—যা আঙুলের ডগা পুড়িয়ে সরাসরি হৃদপিণ্ডের তন্তুতে আঁচ দিচ্ছে। খামটি থেকে বেলি ফুলের মৃদু সুবাস আর ভিজে যাওয়া বর্ষার সোঁদা গন্ধ একাকার হয়ে নাকে এল। এই সুবাস কুহুর খুব প্রিয় ছিল। মেলায় গেলে সে কাচের রেশমি চুড়ির সাথে এক গোছা বেলি ফুল কিনবেই এবং সেই ফুলের মালা শুভ্রর পকেটে গুঁজে দিয়ে বলত, 'গন্ধটা জমিয়ে রাখিস, যখন আমি থাকব না, এই সুবাস তোকে চাবুক মারবে!'

শুভ্র নিজের নির্জন ঘরে ফিরে এল। বড়মামা ততক্ষণে রান্নাঘরের দিকে গেছেন হয়তো কোনো নতুন বৈজ্ঞানিক চায়ের সন্ধানে। শুভ্র কাঁপাকাঁপা হাতে খামটি ছিঁড়ল। ভেতরে আকাশী রঙের পাতলা কাগজ, যাতে কুহুর নিজস্ব অবাধ্যতায় ভরা কালির আঁচড়। চিঠি শুরু হয়েছে কোনো সম্বোধন ছাড়াই: 'শুভ্র, তুই কি ভেবেছিস খাঁচা ভেঙে পাখি উড়ে গেলেই সে মুক্ত? খাঁচার শিকগুলো পাখির বুকে রক্ত হয়ে লেগে থাকে রে বোকা! কাল রাতে যখন ট্রেনের শেষ হুইসেলটা বাজল, আমি ট্রেনের দরজায় চোখ মেলে দাঁড়িয়েছিলাম। আমি জানতাম তুই আসবি না। তোর মতো অলস, অহংকারী আর ভীতু মানুষ কখনো ট্রেনের পেছনে দৌড়াতে পারে না। কিন্তু মনে মনে আমি চাইছিলাম, তুই এসে আমাকে একটা ধমক দে। বল—কুহু, তুই কোথাও যাবি না, তোকে আমি যেতে দেব না। তুই বলিসনি। পুরুষ মানুষের অহংকার নাকি হিমালয়ের চেয়েও উঁচু! আগামী পরশু আমার গায়ে হলুদ। আমার কপালে নাকি খাঁটি চন্দনের ফোঁটা দেওয়া হবে, অথচ আমার মনে হচ্ছে ওগুলো চন্দন নয়, কেউ জ্বলন্ত কয়লার ছ্যাঁকা দিচ্ছে। শোন শুভ্র, আমার হবু বর মানুষটা ভালো, ব্যাঙ্কে বড় চাকরি করে, তার সুন্দর গাড়ি আছে। কিন্তু সে কি জানে বৃষ্টির রাতে রিকশায় হুড ফেলে কীভাবে ভিজতে হয়? সে কি জানে এক ভাঁড় চা ভাগ করে খাওয়ার সুখ কতটা গভীর? তুই কি আসলেই আমাকে যেতে দিবি শুভ্র? এই চিঠিটা যখন তুই পড়বি, তখন হয়তো আমার হাতে মেহেদির গাঢ় লাল রঙ বসে গেছে। কিন্তু তুই ভালো করে তাকিয়ে দেখিস, এই কাগজের মাঝখানের কালিটা কিছুটা লেপটে আছে। ওটা বৃষ্টির পানি নয় রে শুভ্র... ওটা আমার না-বলা চোখের কান্না।' চিঠির শেষটা আকস্মিক, যেন কথা শেষ করার আগেই কলমটি হাত থেকে আছড়ে পড়েছে।

শুভ্রর চোখের পাতা ভারী হয়ে এল। একটা অদ্ভুত অবশ ভাব তার গলা থেকে নেমে বুকের গভীরে চেপে বসল। কান্না পাচ্ছে না, অথচ বুকের ভেতরের বাতাসটুকু যেন বিষাক্ত ভারী সীসা হয়ে আটকে গেছে। সে ঘরের জানালার শিকের দিকে তাকাল। বাইরে আবার মুষলধারে বৃষ্টি নেমেছে। কদমতলীর গলির সেই কালো কুকুরটা একটা ভাঙা রিকশার নিচে গুটিসুটি মেরে শুয়ে কাঁপছে। শুভ্র জানালার কাছে গিয়ে দাঁড়াল। বৃষ্টির ফোঁটা ছিটকে এসে তার চোখে-মুখে লাগছে। এই বৃষ্টি কি কুহুর চোখের জল ধুয়ে দিতে পারবে? নাকি এই শ্রাবণ কেবল তাদের দুজনের বিচ্ছেদের স্বাক্ষী হয়েই ঝরবে আজীবন? মানুষের জীবন এত অদ্ভুত কেন? যাকে সবচেয়ে বেশি কাছে পাওয়ার কথা, তাকেই কেন সবচেয়ে দূরে ঠেলে দিয়ে নির্বাক দাঁড়িয়ে থাকতে হয় নিয়তির পুতুলের মতো?

হঠাৎ পেছনে মৃদু পায়ের আওয়াজ হলো। বড়মামা নিঃশব্দে শুভ্রর পেছনে এসে দাঁড়িয়েছেন। তার হাতে দুটি কাচের গ্লাস, ধোঁয়া ওঠা লাল চা। বড়মামার মুখে সেই খ্যাপাটে ভাবটা এখন আর বিন্দুমাত্র নেই। তার চোখ দুটো অদ্ভুত মায়ায় আর্দ্র। তিনি এক কাপ চা শুভ্রর হাতে তুলে দিলেন। অত্যন্ত ধীর ও কোমল গলায় বড়মামা বললেন, 'চা-টা খা শুভ্র। তেজপাতা আর আদা দিয়ে ফুটিয়েছি। মানুষের কান্না ভেতরের দিকে জমে গেলে বুকের কলকব্জা শক্ত হয়ে পাথর হয়ে যায়। গরম চা সেই পাথরটাকে গলাতে সাহায্য করে।' শুভ্র বড়মামার মুখের দিকে তাকাল। যে বড়মামা একটু আগেই লজ্জাবতীর কান্নার হিসাব করছিলেন, সেই মানুষটার চোখের কোণে এক বিন্দু জল চিকচিক করছে। বড়মামা মৃদু হেসে শুভ্রর মাথায় হাত রেখে বললেন, 'জীবনটা কোনো অঙ্কের সমীকরণ নয় রে পাগল। যেখানে ভুল হলেও কাটাকুটি করে আবার নতুন অঙ্ক পাতা যায়। এখানে ভুলগুলোকেই বুকের পাঁজর বানিয়ে আজীবন বয়ে বেড়াতে হয়। তবে মনে রাখিস—ছেড়ে দেওয়া মানেই কিন্তু হারিয়ে ফেলা নয়। কুহু তোর চিঠির পাতায় যতটা রইল, হয়তো তোর পাশে থাকলে অতটা নিখাদ থাকত না।' বৃষ্টি তখন আরও তীব্র হয়ে টিনের চালে একটানা বাদ্য বাজিয়ে চলেছে, আর সেই শব্দের আড়ালে ঢাকা পড়ে গেল এক তরুণের অস্ফুট এক দীর্ঘশ্বাস।

    text: `ভোরের আকাশটা কেমন যেন বোবা চোখের মতো ফ্যাকাশে হয়ে আছে। গত রাতের মুষলধারে বৃষ্টির পর কদমতলীর গলিটায় এখন হাঁটুসমান কাদাজল। সেই জলের ওপর ভাসছে মরা চালতা পাতা আর মানুষের ফেলে দেওয়া ছেঁড়া পলিথিন। এমন এক উদাস সকালে বড়মামা মোবারক হোসেনকে দেখা গেল এক অদ্ভুত কর্মযজ্ঞে লিপ্ত। তিনি বারান্দার কাঠের গোল টেবিলটায় পরপর তিনটি চিনামাটির কাপ সাজিয়ে রেখেছেন। প্রতিটা কাপে ধোঁয়া ওঠা লাল চা। আর বড়মামার একহাতে ক্লিনিক্যাল থার্মোমিটার, অন্যহাতে পুরানো আমলের একটা স্টপওয়াচ। তিনি এক দৃষ্টিতে ঘড়ির সেকেন্ডের কাঁটার দিকে তাকিয়ে আছেন, যেন কাঁটাটি একটু অসাবধান হলেই মহাবিশ্ব ধ্বংস হয়ে যাবে।

আমি চটি ফটফট করে বারান্দায় এসে দাঁড়ালাম। বড়মামা চোখ না তুলেই হিসহিস করে বললেন, 'চুপ! একদম শব্দ করবি না শাফিন। গ্র্যাভিটেশনাল পুলের সঙ্গে আক্ষেপের একটা সরাসরি সংযোগ ঘটছে এখন। তুই পা নাড়ালে বাতাসের অণুগুলো নড়ে যাবে, আর আমার পুরো এক্সপেরিমেন্টটা ভেস্তে যাবে।' আমি বললাম, 'বড়মামা, চায়ের মধ্যে থার্মোমিটার গুঁজে দিয়ে আপনি কিসের এক্সপেরিমেন্ট করছেন? জ্বর মাপছেন চায়ের?' বড়মামা অত্যন্ত বিরক্ত চোখে আমার দিকে তাকালেন। চশমার কাচ বেয়ে নেমে আসা চোখে তীব্র ধিক্কার ঢেলে বললেন, 'মূর্খ! সারাজীবন বাউণ্ডুলেপনা করে গেলি, বিজ্ঞানের কোনো কদর বুঝলি না। আমি বের করছি—মানুষ যখন দীর্ঘশ্বাস ফেলে, তখন তার সামনে থাকা চায়ের কাপ কত দ্রুত ঠান্ডা হয়। একে বলে থার্মো-ইমোশনাল ডায়নামিক্স। কাল রাত থেকে তুই অন্তত একুশবার দীর্ঘশ্বাস ফেলেছিস। আমি হিসেব করে দেখেছি, সাধারণ বাতাসের চেয়ে দীর্ঘশ্বাসের তাপে চা জমে বরফ হতে সময় নেয় তিন মিনিট কম!'

আমি কিছু বললাম না। বড়মামার পাগলামিগুলোর পেছনে এক অদ্ভুত মায়া থাকে। তিনি জানেন আমার মনের ভেতর কী কালবৈশাখী ঝড় বয়ে গেছে গত রাতে। কুহুর বিয়ের খবর আসার পর থেকে আমার বুকের বাম দিকটায় যে পাথর চেপে বসেছে, বড়মামা সেটা এই খ্যাপাটে বিজ্ঞানের মোড়কে হালকা করতে চাইছেন। এমন সময় ময়নাবুজি ঘরে ঢুকলেন একবাটি মুড়ি আর আদা দেওয়া চা নিয়ে। ময়নাবুজি বড়মামার দিকে তাকিয়ে মুখ বেঁকিয়ে বললেন, 'নিজের খাওয়ার মুরোদ নাই, খালি কাপে কাঠি গুঁতাইতেছে। শাফিন ভাইজান, আপনে এই পাগল বুইড়ার কথা শুনবেন না। এই নেন, গরম চা খান। তিতলি আপার কাজের মেয়ে সক্কালবেলা আইসা একটা জিনিস দিয়া গেছে। সোবহানের হাতে আছে।' 'সোবহান কোথায়?' আমি চমকে উঠে জিজ্ঞেস করলাম।

সোবহান মিয়া সিঁড়ির গোড়ায় কাঁচুমাচু হয়ে দাঁড়িয়ে ছিল। তার মাথায় ভেজা গামছা, গায়ে একটা মলিন ফতুয়া। আমাকে দেখে সে চটের থলে থেকে একটা পুরানো খবরের কাগজে মোড়ানো চারকোনা প্যাকেট বের করল। প্যাকেটটা আমার হাতে তুলে দিতে গিয়ে সোবহানের হাতটা সামান্য কেঁপে উঠল। সে মাটির দিকে তাকিয়ে অত্যন্ত ধীর গলায় বলল, 'শাফিন ভাই, তিতলি আপা নিজের হাতে এইটা আমারে দিয়া কইছে—সোবহান কাকা, শাফিন ভাইয়ের হাত ছাড়া অন্য কারও হাতে দিবা না। কইবা, কাঁচের জিনিস, ভাঙলে যেন শব্দ না হয়।' সোবহানের চোখের কোণে জল চিকচিক করে উঠল। সে দীর্ঘশ্বাস ফেলে বলল, 'শাফিন ভাই, রিকশার প্যাডেল ঘুরাইলে চাকা সামনের দিকে যায়, কিন্তু পরাণের প্যাডেল ঘুরাইলে মানুষ পিছলায়া গভীর খাদে পড়ে। আপনেরে আমি কতদিন ওই বাড়ির সামনে রিকশায় বসাইয়া রাখছি, আপনে তো কোনোদিন ডাইকা ঘরে গেলেন না।' সোবহান আর দাঁড়াল না, লুঙ্গির খুঁটে চোখ মুছতে মুছতে কাদার মধ্যে চটি ফেলে নেমে গেল।

আমি ঘরে এসে দরজাটা ভেতর থেকে ভেজিয়ে দিলাম। বুকের ভেতর হাতুড়িপেটার মতো শব্দ হচ্ছে। খবরের কাগজের বাঁধনটা খুলতেই ভেতর থেকে বেরিয়ে এলো দুটো জিনিস—একটি গাঢ় হলুদ রঙের পোস্টাল খাম, আর তার নিচে নরম তুলোয় জড়ানো একজোড়া ঘন সবুজ রেশমি কাঁচের চুড়ি। এই চুড়িদুটো আমার বড্ড চেনা। গত বছর চৈত্র সংক্রান্তির মেলায় যখন ভিড়ের মধ্যে কুহুর হাত থেকে একটা চুড়ি ভেঙে রক্তারক্তি হয়েছিল, তখন আমি রাগ করে বলেছিলাম, 'এত ঠুনকো জিনিস পরার কী দরকার?' কুহু অভিমানে ঠোঁট ফুলিয়ে বলেছিল, 'যে জিনিস যত সহজে ভাঙে, তার মায়া তত বেশি শুভ্র। তুমি বুঝবে না।' আমি মেলা থেকে ফেরার পথে চুড়িওয়ালার কাছ থেকে এক ডজন সবুজ রেশমি চুড়ি কিনে ওর ওড়নার কোণায় বেঁধে দিয়েছিলাম। সেই বারোটার মধ্যে বাকি দশটা সে ভেঙেছে হয়তো, কিন্তু এই দুটো রয়ে গেছে অক্ষত। আজ সেই অপূর্ণ বৃত্ত সে ফিরিয়ে দিয়েছে।

হলুদ খামের চিঠিটা খুলতেই পরিচিত সেই বকুল ফুলের ঘ্রাণ নাকে এসে ধাক্কা দিল। কুহুর হাতের লেখা অদ্ভুত সুন্দর, মুক্তোর মতো টানা টানা। চিঠির প্রথম বাক্যেই কোনো সম্বোধন নেই, সরাসরি শুরু হয়েছে অভিমানের বৃষ্টি:
'শুভ্র,
তুমি নিশ্চয়ই ভেবেছিলে আমি পালিয়ে গিয়ে তোমার দরজায় এসে দাঁড়াব? বলব—শুভ্র, আমাকে নিয়ে অনেক দূরে কোথাও চলে যাও? না, আমি তা করব না। কারণ আমি জানি, তুমি আকাশের দিকে তাকিয়ে একটা দীর্ঘশ্বাস ফেলে বলবে, 'কুহু, সংসার বড় জটিল জায়গা।' পুরুষ মানুষের এই এক অদ্ভুত অহংকার শুভ্র—তারা ভালোবাসার জন্য বুক পাততে পারে, কিন্তু সেই ভালোবাসাকে আঁকড়ে ধরে দাবি করার সাহস তাদের থাকে না। তুমি আমাকে কোনোদিন আটকালে না। একবারও বললে না, 'যেও না।'

চিঠির পাতাটা চোখের জলে ভিজে ঝাপসা হয়ে আসছিল। আমি এক নিঃশ্বাসে বাকিটুকু পড়লাম:
'আগামী শুক্রবার আমার গায়ে হলুদ। বাবা পাত্রপক্ষের পছন্দমতো বেনারসি কিনে এনেছেন। পুরো বাড়ি আলোয় সেজে উঠছে, আর আমার মনে হচ্ছে আমি একটা জীবন্ত কবরের ভেতর বসে শাড়ি বাছাই করছি। যে লোকটাকে আমি কোনোদিন দেখিনি, যার চোখের দিকে তাকালে অচেনা শূন্যতা ছাড়া কিছু দেখা যায় না, তার হাতেই নাকি আমার বাকি জীবনটা সঁপে দিতে হবে! তোমার সেই ভাঙা বারান্দার কদমতলীর বৃষ্টিটার কথা মনে পড়ছে শুভ্র। শেষ বিকেলের রোদে যখন তুমি একা দাঁড়িয়ে থাকতে, আমার খুব ইচ্ছে হতো এক ফোঁটা শ্রাবণের জল হয়ে তোমার চিবুক ছুঁয়ে গড়িয়ে পড়ি। কিন্তু জল তো বাষ্প হয়ে যায়, যেমন করে আমাদের দিনগুলো উড়ে গেল। সবুজ চুড়ি দুটো তোমাকে ফেরত দিলাম। পারলে নদীর জলে ভাসিয়ে দিও, নিজের কাছে রেখে পাপ বাড়িয়ো না। ইতি—তোমার কুহু (যে আর কোনোদিন কুহু ডাক শুনবে না)।'

চিঠির শেষ লাইনটায় কালির দাগ লেপটে গেছে। স্পষ্ট বোঝা যায়, লেখার সময় কুহুর চোখের জল ঠিক সেই জায়গাটিতে টুপ করে খসে পড়েছিল। আমার মনে হলো, আমার পাঁজরের হাড়গুলো মটমট করে ভেঙে গুঁড়ো হয়ে যাচ্ছে। একটা মানুষ কতটা নিঃশব্দে ভালোবাসলে এতটা অভিমান বুকে চেপে অচেনা এক ভবিষ্যতের দিকে পা বাড়াতে পারে? আমি জানালার শিকে কপাল ঠেকিয়ে দাঁড়িয়ে রইলাম। বাইরের কদমতলীতে তখন বাতাসের শনশন শব্দ। বৃষ্টির পর মেঘের বুক চিরে হঠাৎ এক ফালি তেরছা রোদ এসে পড়েছে স্যাঁতসেঁতে মেঝের ওপর। সেই রোদে সবুজ চুড়ি দুটো অদ্ভুত এক মায়াবী আলো ছড়াচ্ছে। ঠিক যেন কুহুর সেই সজল চোখের চাউনি।

হঠাৎ দরজায় হালকা টোকা পড়ল। নিঃশব্দে ঘরে ঢুকলেন বড়মামা। তাঁর হাতে আর স্টপওয়াচ কিংবা থার্মোমিটার নেই। বড়মামার মুখে সেই খ্যাপাটে ভাবটাও আর দেখা যাচ্ছে না। তিনি এসে আমার ঠিক পেছনে দাঁড়ালেন। তারপর একটা শুকনো, কাঁপা হাত আমার কাঁধের ওপর রাখলেন। বড়মামা কোনো কথা বললেন না অনেকক্ষণ। ঘরের ভেতর শুধু দেয়ালঘড়ির টিকটিক শব্দ আর আমার অবরুদ্ধ কান্নার ঘড়ঘড় আওয়াজ। বড়মামা ধীরে ধীরে বললেন, 'রবীন্দ্রনাথ একবার এক চিঠিতে লিখেছিলেন—যে পায় সে হারায়, যে হারায় সে পায় না, কিন্তু যে হারিয়েও বুকের ভেতর ছবিটা ধরে রাখে, সে অমর হয়ে যায়।' আমি অস্ফুটে বললাম, 'বড়মামা, রবীন্দ্রনাথ এমন কথা কোথাও লেখেননি।' বড়মামা একটু ম্লান হাসলেন। তাঁর চোখেও চিকচিক করছে নীরব আর্দ্রতা। তিনি বললেন, 'লেখেননি তো কী হয়েছে? আমার মতো হতভাগা মামা তো লিখতে পারে। কাঁদবি শাফিন? একটু কেঁদে নে। মানুষ যখন কাঁদতে ভুলে যায়, তখন সে পাথর হয়ে যায়। পাথরের কোনো প্রেম থাকে না।' বড়মামা নিঃশব্দে আমার মাথাটা টেনে নিয়ে তাঁর বুকে চেপে ধরলেন। একজন খ্যাপাটে প্রৌঢ়ের বুকে মুখ লুকিয়ে আমি এই প্রথম কুহুর জন্য শিশুর মতো ডুকরে কেঁদে উঠলাম।

রাত নেমেছে কদমতলীর বুকে। বৃষ্টি আর নেই, তবে ঠান্ডা বাতাস বইছে বুনো গন্ধ নিয়ে। পুরো শহর ঘুমিয়ে পড়েছে, কিন্তু আমার চোখে ঘুম নেই। আমি সবুজ চুড়ি দুটো পকেটে পুরে অন্ধকার গলির মুখে এসে দাঁড়ালাম। সোবহানের রিকশাটা মোড়ের ল্যাম্পপোস্টের নিচে একা দাঁড়িয়ে আছে, হুড তোলা। আমি নিঃশব্দে হেঁটে গিয়ে রিকশায় উঠলাম। সোবহান মুখ ফিরিয়ে দেখল, কিছু জিজ্ঞেস করল না। শুধু প্যাডেলে পা দিয়ে বলল, 'কোন বাগে যাইবেন শাফিন ভাই?' আমি আকাশের কালো মেঘের দিকে তাকিয়ে পকেটের চুড়ি দুটো শক্ত করে মুঠোর ভেতর চেপে ধরলাম। ভাঙা কাঁচের কোনো এক কোণ হয়তো আমার তালুতে বিঁধে গেল, কিন্তু কোনো রক্ত বের হলো না। আমি অস্ফুট স্বরে বললাম, 'যেদিকে আলো নেই সোবহান, ঠিক সেই দিকটায় চলো।' রিকশার চাকা প্যাডেলের শব্দে মধ্যরাতের ভেজা পিচঢালা পথ চিরে সামনের দিকে চলতে লাগল।

    date: "৪ নভেম্বর ২০২৬",
    text: `ভোরের আলো ফুটতেই বড়মামার ঘরে তীব্র বিস্ফোরণের মতো শব্দ হলো। শব্দটা বোমা ফাটার নয়, ধাতব বালতি উল্টে পড়ার। আমি ধড়মড় করে বিছানায় উঠে বসলাম। বড়মামার বৈজ্ঞানিক গবেষণার সময়সূচি ঠিক সাধারণ মানুষের মতো নয়। সাধারণ মানুষ যখন চোখ ডলতে ডলতে বাথরুমে যায়, বড়মামা তখন মহাবিশ্বের নতুন কোনো রহস্য ভেদ করতে ব্যস্ত থাকেন। ঘরের দরজায় গিয়ে দেখি, মেঝেময় কাচের মার্বেল ছড়ানো। বড়মামা লুঙ্গি মালকোঁচা মেরে একটা টেবিলফ্যানের সামনে হাঁটু গেড়ে বসে আছেন। তাঁর হাতে একটা প্রকাণ্ড আতশ কাচ। আমাকে দেখে তিনি অত্যন্ত গম্ভীর মুখে বললেন, 'শাফিন, সাবধানে পা ফেল। একদম নড়বি না। মার্বেলে পা পিছলে যদি তোর মেরুদণ্ড ভেঙে যায়, তাহলে আমাকে আবার হাড়জোড়া লাগানোর আয়ুর্বেদিক তেলের ফর্মুলা নিয়ে বসতে হবে। আমার হাতে এখন সময় খুব কম। আমেরিকার নাসা থেকে এখনো চিঠি আসেনি ঠিকই, তবে ওরা টের পেয়ে গেছে আমি বাতাসে সুর তরঙ্গের ওজন মাপছি। ফ্যানের বাতাসের ওজন কত বল তো?'

আমি দেয়ালে হেলান দিয়ে হাই তুলে বললাম, 'বড়মামা, বাতাসের তো ওজন মাপার দরকার নেই। সকালবেলা ময়না বুজি এখনো চা দেয়নি। আপনার সুর তরঙ্গের ওজন মাপার আগে চায়ের ওজনটা একটু মাপুন।' বড়মামা বিরক্ত চোখে আমার দিকে তাকালেন। চশমার একদিকের কাচ ঘোলা, অন্যদিকটা শূন্য। তিনি চশমাটা নাকের ডগায় নামিয়ে বললেন, 'চা? তুই একটা আস্ত গবেট শাফিন। রবীন্দ্রনাথ ঠাকুর সকালে ঘুম থেকে উঠে কোনোদিন লাল চা চেয়েছেন বলে প্রমাণ নেই। তিনি ভোরবেলা পদ্মায় বোটের ওপর বসে বলতেন—ওগো বাতাসে তুমি কার কান্নার সুর বয়ে আনলে গো! এটা রবীন্দ্রসঙ্গীতের আদি খসড়া। পরে শান্তিনিকেতনের লোকজন এটাকে বিকৃত করে সুর বসিয়েছে। যাই হোক, তুই কি কুহুর খবর জানিস?' বড়মামার হঠাৎ এই প্রশ্নে আমার বুকের ভেতরটা এক মুহূর্তের জন্য থেমে গেল। বাইরের রোদেলা শ্রাবণের সকালটা আচমকা কুয়াশার মতো ঘোলাটে হয়ে এলো।

আমি সহজ হওয়ার ভান করে বললাম, 'কুহুর আবার কী খবর? ওর তো সামনে শুক্রবার বিয়ে। আপনি নিজেই তো বললেন হলুদ খাম এসেছে।' বড়মামা ফ্যানটা বন্ধ করে দিলেন। ঘরের ভেতর এক অদ্ভুত স্তব্ধতা নেমে এলো। বড়মামা টেবিল থেকে একটা চকচকে গোল মেটালিক কৌটা হাতে নিলেন। তাঁর চোখে-মুখে খ্যাপাটে ভাবটা হঠাৎ উবে গিয়ে এক অদ্ভুত মায়া ফুটে উঠল। তিনি নিচু গলায় বললেন, 'মেয়েটা ভোরবেলা সোবহানের রিকশায় চড়ে এসেছিল। তুই তখন মরার মতো ঘুমাচ্ছিলি। সোবহান ওকে গেটের বাইরে রিকশায় বসিয়ে রেখে এসেছিল। কুহু বাড়ির ভেতর ঢোকেনি। দরজার কড়ায় এই কৌটাটা ঝুলিয়ে দিয়ে গেছে। আমাকে দেখে বলল—বড়মামা, শুভ্রকে বলবেন আমি কোনো অভিযোগ রেখে যাইনি, শুধু একমুঠো ভাঙা কাচ রেখে গেলাম। শাফিন, মেয়েটার মুখটা কেমন শুকিয়ে বেলের শুঁটকি হয়ে গেছে রে! তোকে আমি পদার্থবিজ্ঞান শিখিয়েছি, কিন্তু মানুষের বুকের ভেতরের চাপ মাপার ব্যারোমিটার তো শেখাতে পারলাম না।'

বড়মামার হাত থেকে টিনের গোল কৌটোটা নিতে গিয়ে আমার আঙুল কাঁপল। কৌটোর ডালাটা খুলতেই একরাশ তাজা বকুল ফুলের শুকনো গন্ধ ভেসে এলো। ভেতরে রেশমি সুতোয় বাঁধা একজোড়া সবুজ কাচের চুড়ি, যার একটা মাঝখান থেকে ভেঙে নিখুঁত দুই টুকরো হয়ে গেছে। আর তার নিচে ভাঁজ করা একটুকরো বাদামি কাগজ। কাঁপাকাঁপা টানা টানা অক্ষরে কুহু লিখেছে: 'শুভ্র, মানুষ কি ইচ্ছে করলেই কাউকে ভুলে যেতে পারে? না পারলে ভুলে থাকার ওষুধটা তোমার খ্যাপা বড়মামাকে বানিয়ে দিতে বলো। আমার খুব ঘুম পাচ্ছে, কিন্তু আমি ঘুমাতে পারছি না। মা গতকাল আমার হাতভর্তি এই সবুজ চুড়িগুলো পরিয়ে দিয়েছিলেন। তিনি বললেন, বরের বাড়ির লোকজন সবুজ রঙ পছন্দ করে। আমি বাথরুমে গিয়ে একটা চুড়ি বেসিনে ঠুকে ভেঙে ফেলেছি। শুভ্র, ভাঙা জিনিস জোড়া লাগে না, এই সত্যটা তুমি যেমন জানো, আমিও জানি। তবু আমি চেয়েছিলাম তুমি একবার অন্তত কদমতলীর মোড়ে এসে দাঁড়িয়ে বলবে—যেও না তিতলি। তুমি বললে না। তোমার বড়মামা ঠিকই বলেন, তুমি পৃথিবীর সবচেয়ে নিখুঁত অথচ বোকা পাথর।' চিঠির শেষটা অশ্রুর ফোঁটায় ভিজে লেপ্টে গেছে, কালির নীল রং ছড়িয়ে একটা ছোটখাটো মেঘের মতো তৈরি হয়েছে কাগজে।

ময়না বুজি এক কাপ গরম চা নিয়ে ঘরে ঢুকল। কাপটা টেবিলে নামিয়ে রেখে সে আঁচল দিয়ে চোখ মুছল। ময়না বুজির এই এক স্বভাব, কোনো কারণ ছাড়াই সে হঠাৎ কেঁদে ফেলে। আজ অবশ্য কারণ আছে। সে ধরা গলায় বলল, 'ছোট খালাম্মা যখন চইলা যায়, তার চোখ থেইকা পানির ফোঁটা টপ টপ কইরা রিকশার পাদানিতে পড়ছিল ভাইজান। আমারে ডাইকা কইল—ময়না বুজি, শুভ্ররে কইয়ো ওর ছেঁড়া নীল শার্টের বোতামটা আমি ড্রয়ারে রাইখা গেছি, ও যেন আর সুঁই দিয়া নিজের আঙুল না ফোঁড়ায়। আহারে, এমন চান্দের টুকরা মাইয়া পর হইয়া যাইব গা!' আমি কোনো কথা বললাম না। জানালার গ্রিল ধরে বাইরে তাকালাম। শ্রাবণের রোদটা বড় অদ্ভুত। একটু আগে যে রোদ ঝলমল করছিল, হঠাৎ কোথা থেকে একখণ্ড কালো মেঘ এসে পুরো ঢাকা শহরের ওপর একটা ভারী ছায়া ফেলে দিল। বাতাসের গতি বদলে গেল মুহূর্তেই। গাছপালার পাতায় একধরনের অস্থির কাঁপন শুরু হলো।

বড়মামা আমার পাশে এসে দাঁড়ালেন। তাঁর খ্যাপাটেপনা এখন পুরোপুরি মুছে গেছে। তিনি আমার কাঁধে একটা ভারী, স্নেহময় হাত রাখলেন। বড়মামা কোনোদিন কাউকে স্পর্শ করে সান্ত্বনা দেন না, আজ দিলেন। তিনি ফিসফিস করে বললেন, 'শাফিন, মহাবিশ্বের সবচেয়ে ভারী বস্তু কী জানিস? নিউট্রন স্টার নয়, ব্ল্যাকহোলও নয়। মহাবিশ্বের সবচেয়ে ভারী বস্তু হলো প্রেমিকার না-বলা কথা। এই বোঝা নিয়ে কোনো মানুষ সোজা হয়ে দাঁড়াতে পারে না। কিন্তু তোকে দাঁড়াতে হবে। রবীন্দ্রনাথ এক জায়গায় লিখেছেন—যাহা যায় তাহা যাক, শুধু স্মৃতিটুকু থাক। এইটা অবশ্য রবীন্দ্রনাথের নিজের কথা না, আমি বানিয়ে বললাম। তবে কথাটা সত্যি। যা চলে যাচ্ছে, তাকে আটকানোর চেষ্টা করা মানে ঘূর্ণি বাতাসে হাত পেতে বাতাস ধরার চেষ্টা করা। হাত মুট করবি, দেখবি বাতাস নেই, শুধু শূন্যতাটুকু বন্দী হয়ে আছে।' বড়মামার চোখের কোণে কি এক ফোঁটা জল চিকচিক করছিল? আমি তাকাতেই তিনি চট করে চোখ ফিরিয়ে নিয়ে হাঁক ছাড়লেন, 'ময়না! চায়ে চিনি কম দিয়েছিস কেন রে অপদার্থ মহিলা? চিনি ছাড়া চা খাওয়া আর রবীন্দ্রসঙ্গীত ছাড়া বিবাহ করা একই রকম অর্থহীন!'

দুপুর গড়িয়ে বিকেল হতেই কদমতলীর আকাশ ভেঙে অঝোর ধারায় বৃষ্টি নামল। এমন বৃষ্টি যা ঢাকার সমস্ত নর্দমা, ধুলোবালি আর দুঃখকে ভাসিয়ে নিয়ে যেতে চায়, কিন্তু পারে না। আমি ছাতা না নিয়েই রাস্তায় নেমে এলাম। কদমতলীর মোড়ে সোবহান মিয়া তার রিকশার হুড তুলে বসে বিড়ি টানছিল। আমাকে দেখেই সে বিড়িটা ফেলে দিল। বৃষ্টির পানিতে তার পুরোনো রিকশার ঘণ্টা ভিজে ঢং ঢং শব্দ করছে। সোবহান মিয়া করুণ চোখে চেয়ে বলল, 'ছোটভাই, রিকশায় ওঠেন। কই যাইবেন কন? আপনের মন খারাপ থাকলে আমার প্যাডেল ঘুরতে চায় না। দুনিয়াটা হইলো গিয়া রিকশার উল্টা প্যাডেল। যতো জোরে চাপবেন, ততো খালি চেইন পইড়া যাইবো, আগাইবো না এক ইঞ্চিও।' আমি রিকশায় উঠলাম না। বৃষ্টিতে আমার সারা শরীর ভিজে একাকার হয়ে যাচ্ছিল। পকেটে কুহুর সেই ভাঙা কাচের চুড়ির টুকরোটা আমার পাঁজরের সাথে বিঁধছিল। সেই ব্যথা কোনো ক্ষতের নয়, সেই ব্যথা হারিয়ে ফেলার এক মায়াবী, নীল হাহাকারের।`
  }
];
/* ===== গল্পের তালিকা শেষ ===== */

const app = document.getElementById("app");
const progress = document.getElementById("progress");
const BN = "০১২৩৪৫৬৭৮৯";
const bn = n => String(n).replace(/\d/g, d => BN[d]);

function el(tag, text, cls){
  const e = document.createElement(tag);
  if(text) e.textContent = text;
  if(cls) e.className = cls;
  return e;
}

function clip(str, n){
  try{
    const out = [];
    for(const x of new Intl.Segmenter("bn", {granularity:"grapheme"}).segment(str)){
      if(out.length >= n) break;
      out.push(x.segment);
    }
    return out.join("") + "…";
  }catch(e){ return str.slice(0, n) + "…"; }
}

function readTime(s){
  const words = s.text.trim().split(/\s+/).length;
  return "পড়তে প্রায় " + bn(Math.max(1, Math.ceil(words / 180))) + " মিনিট";
}

function cover(s, i){
  if(s.cover){
    const img = el("img", "", "cover");
    img.src = s.cover;
    img.alt = s.title + " গল্পের কভার";
    img.loading = "lazy";
    return img;
  }
  const d = el("div", "", "cover c" + (i % 4));
  d.append(el("span", s.title));
  return d;
}

function currentTheme(){
  return document.documentElement.dataset.theme ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}

function topbar(backLink){
  const bar = el("div", "", "topbar");
  if(backLink){
    const back = el("a", "সব গল্প");
    back.href = "#";
    bar.append(back);
  }else{
    bar.append(el("span"));
  }
  const btn = el("button", currentTheme() === "dark" ? "আলো" : "আঁধার", "theme");
  btn.type = "button";
  btn.setAttribute("aria-label", "আলো বা আঁধার মোড বদলান");
  btn.addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try{ localStorage.setItem("theme", next); }catch(e){}
    btn.textContent = next === "dark" ? "আলো" : "আঁধার";
    if(reduce.matches) drawRain(false);
  });
  bar.append(btn);
  return bar;
}

function home(){
  document.title = SITE.title;
  document.body.classList.remove("reading");
  progress.style.width = "0";
  app.replaceChildren(topbar(false));
  const mast = el("header", "", "masthead");
  mast.append(el("h1", SITE.title, "brand"), el("p", SITE.intro, "intro"));
  app.append(mast);
  STORIES.forEach((s, i) => {
    const item = el("div", "", "story-item");
    const thumb = el("div", "", "thumb");
    const link = el("a");
    link.href = "#" + s.id;
    link.setAttribute("aria-label", s.title);
    link.append(cover(s, i));
    thumb.append(link);
    const body = el("div", "", "body");
    const h2 = el("h2");
    const a = el("a", s.title);
    a.href = "#" + s.id;
    h2.append(a);
    const meta = el("p", "", "meta");
    meta.append(el("span", s.date), el("span", readTime(s)));
    const first = s.text.trim().split(/\n\s*\n/)[0];
    body.append(h2, meta, el("p", clip(first, 110), "excerpt"));
    item.append(thumb, body);
    app.append(item);
  });
  footer();
  window.scrollTo(0, 0);
}

function story(s){
  const idx = STORIES.indexOf(s);
  document.title = s.title + " | " + SITE.title;
  document.body.classList.add("reading");
  app.replaceChildren(topbar(true));
  const art = el("article");
  const head = el("header", "", "article-head");
  const hero = el("div", "", "hero");
  hero.append(cover(s, idx));
  const meta = el("p", "", "meta");
  meta.append(el("span", s.date), el("span", readTime(s)));
  head.append(hero, el("h1", s.title), meta);
  const prose = el("div", "", "prose");
  s.text.trim().split(/\n\s*\n/).forEach(p => {
    const t = p.trim();
    prose.append(el("p", t, /^চলবে/.test(t) ? "end" : ""));
  });
  art.append(head, prose);
  app.append(art);
  const prev = STORIES[idx - 1], next = STORIES[idx + 1];
  if(prev || next){
    const pager = el("nav", "", "pager");
    pager.setAttribute("aria-label", "অন্য গল্প");
    if(prev){
      const a = el("a", "", "prev");
      a.href = "#" + prev.id;
      a.append(el("small", "আগের গল্প"), el("span", prev.title));
      pager.append(a);
    }
    if(next){
      const a = el("a", "", "next");
      a.href = "#" + next.id;
      a.append(el("small", "পরের গল্প"), el("span", next.title));
      pager.append(a);
    }
    app.append(pager);
  }
  footer();
  window.scrollTo(0, 0);
  updateProgress();
}

function footer(){
  app.append(el("footer", "© " + bn(new Date().getFullYear()) + " " + SITE.author));
}

function updateProgress(){
  if(!document.body.classList.contains("reading")){ progress.style.width = "0"; return; }
  const max = document.documentElement.scrollHeight - innerHeight;
  progress.style.width = (max > 0 ? Math.min(100, scrollY / max * 100) : 0) + "%";
}
addEventListener("scroll", updateProgress, {passive:true});

/* বৃষ্টির রেখা */
const rainCv = document.getElementById("rain");
const rcx = rainCv.getContext("2d");
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
let RW = 0, RH = 0, drops = [];
function sizeRain(){
  const r = devicePixelRatio || 1;
  RW = innerWidth; RH = innerHeight;
  rainCv.width = RW * r; rainCv.height = RH * r;
  rcx.setTransform(r, 0, 0, r, 0, 0);
  drops = Array.from({length: Math.round(RW / 22)}, () => ({
    x: Math.random() * RW, y: Math.random() * RH,
    l: 14 + Math.random() * 26, v: 3 + Math.random() * 4
  }));
}
function drawRain(move){
  rcx.clearRect(0, 0, RW, RH);
  rcx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--rain").trim();
  rcx.lineWidth = 1;
  rcx.beginPath();
  for(const d of drops){
    rcx.moveTo(d.x, d.y);
    rcx.lineTo(d.x - d.l * .18, d.y + d.l);
    if(move){
      d.y += d.v; d.x -= d.v * .18;
      if(d.y > RH){ d.y = -d.l; d.x = Math.random() * RW + RW * .1; }
    }
  }
  rcx.stroke();
}
function rainLoop(){ drawRain(true); requestAnimationFrame(rainLoop); }
sizeRain();
addEventListener("resize", () => { sizeRain(); if(reduce.matches) drawRain(false); });
if(reduce.matches) drawRain(false); else rainLoop();

function route(){
  const id = location.hash.slice(1);
  const s = STORIES.find(x => x.id === id);
  s ? story(s) : home();
}
addEventListener("hashchange", route);
route();
</script>
