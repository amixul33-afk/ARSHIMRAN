<script>
/* নতুন গল্প যোগ করতে STORIES তালিকায় object যোগ করুন। প্রতিটি পর্ব episodes তালিকায় দিন। */
const STORIES = [
  {
    id: "bunoful",
    title: "বুনোফুল",
    category: "গল্প",
    description: "Arsh Imran",
    episodes: [
      {
        title: "প্রথম পর্ব",
        content: `শ্রাবণ মাসের দুপুরগুলো কেমন যেন অদ্ভুত রকমের বিষণ্ণ হয়। আকাশে মেঘ ডাকছে গম্ভীর স্বরে, ঠিক যেন কোনো অসন্তুষ্ট বৃদ্ধের দীর্ঘশ্বাস। বাতাস ভারী, স্যাঁতসেঁতে এবং কদমফুলের ভেজা গন্ধে ভরপুর। আমাদের এই ছোট্ট ভাড়া বাড়ির টিনের চালে একটানা বৃষ্টির শব্দ হচ্ছিল—ঝুমঝুম, ঝমরঝমর। যেন কোনো ক্ষ্যাপা বাদক একটানা একঘেয়ে তবলার বোল বাজিয়ে যাচ্ছে। চারপাশের সবকিছু ভিজে একাকার। উঠোনের এক কোণে জমে থাকা বৃষ্টির জলে একটি মৃত চড়ুই পাখির পালক ভাসছে চক্রাকারে। প্রকৃতি যখন কাঁদে, তখন পৃথিবীর সমস্ত ক্ষুদ্র প্রাণীও যেন সেই কান্নার শরিক হয়।

আমি বারান্দার এক কোণে দাঁড়িয়ে ছিলাম। বারান্দাটা এতই ছোট যে দু'জন মানুষ পাশাপাশি দাঁড়ালে একজনের কাঁধ অন্যজনের গায়ে সজোরে ধাক্কা খায়। এই ছোট্ট স্যাঁতসেঁতে জায়গাটুকুই আমার সারাটা দিনের রাজ্য। আমার বড় বোন নীলু—যার আসল নাম নীলিমা, ঘরের ভেতর মাদুর পেতে বসে সেলাই করছিল। একটা পুরোনো নীল রঙের চাদরে লাল আর হলুদ সুতো দিয়ে সে ফুল তুলছে। সুতোর রং ফুরিয়ে এসেছে অনেক আগেই, তবুও নীলুর হাত থামছে না। সে বারবার ক্ষয়ে যাওয়া সুতোটার ডগা জিভে ভিজিয়ে নিচ্ছে আর নিপুণ ভঙ্গিতে সুঁইয়ের ছিদ্রে গলানোর চেষ্টা করছে। তার চোখে গভীর মনোযোগ, অথচ মুখে এক অদ্ভুত ক্লান্তির নীল ছায়া। তার বয়স মাত্র তেইশ, অথচ তার চাহনিতে এমন এক প্রাচীন বিষাদ জমে আছে যা সচরাচর সত্তুর বছরের বৃদ্ধাদের চোখে দেখা যায়।

নীলু হঠাৎ মাথা তুলে আমার দিকে তাকাল। তার ঠোঁটের কোণে এক চিলতে অদ্ভুত ম্লান হাসি খেলে গেল। সে বলল, 'কী রে অনিক, তুই কি আজ সারাদিন এই বৃষ্টির দিকে তাকিয়েই কাটিয়ে দিবি? কোনো পড়াশোনা নেই? সামনে তোর ইন্টারমিডিয়েট পরীক্ষা, আর তুই কাকতাড়ুয়ার মতো দাঁড়িয়ে বৃষ্টি দেখছিস!' আমি একটা দীর্ঘশ্বাস ফেলে বললাম, 'আপা, বৃষ্টি দেখলে আমার বুকটা কেমন যেন ফাঁকা ফাঁকা লাগে। মনে হয় দূর দেশের কেউ একজন চিঠি পাঠাতে চেয়েছিল, কিন্তু পোস্ট অফিসের ঠিকানা হারিয়ে ফেলেছে।' নীলু আমার কথায় একটু হাসল। তারপর বলল, 'তোর স্বভাবটা একদম ছোটকাকার মতো হয়েছে। অদ্ভুত সব কথা বলিস। শোন, তোর পেটে কি খিদে পেয়েছে? রান্নাঘরে একটু আতপ চালের খুদ আছে, তোকে গরম করে একটু ফ্যানাভাত করে দেব?'

আমি কিছু বলার আগেই সদর দরজায় অতি মৃদু করাঘাতের শব্দ হলো। অতি সন্তর্পণে কড়া নাড়ার ভঙ্গি। এই পরিবারে কেবল একজন মানুষই এভাবে কড়া নাড়েন—বাবা। মোবারক আলী। জজকোর্টের অতি সাধারণ এক মহরার। সারাটা জীবন অন্যের দলিলের নকল তুলতে তুলতে যাঁর আঙুলের ডগাগুলো কড়া পড়ে বাঁকা হয়ে গেছে। বাবা কখনো জোরে দরজায় আঘাত করতে পারেন না। তিনি হয়তো মনে মনে বিশ্বাস করেন, তাঁর উপস্থিতির কারণে ঘরের কেউ যদি সামান্যতম চমকেও ওঠে বা কারো বিশ্রামে বিঘ্ন ঘটে, তবে সেই পাপের বোঝা তিনি পরকালে বইতে পারবেন না। একজন অতিরিক্ত বিনয়ী মানুষ সমাজে সবসময় চরম অবহেলার শিকার হয়, বাবা ছিলেন তারই জ্বলন্ত প্রতিমূর্তি।

আমি দৌড়ে গিয়ে পুরোনো খিলটা তুলে দরজা খুলে দিলাম। দরজার চৌকাঠে বাবা দাঁড়িয়ে আছেন। তাঁর পরনে বিবর্ণ খাকি রঙের ঢিলেঢালা ট্রাউজার, আর এককালে সাদা থাকা কিন্তু এখন ধোঁয়াটে ছাই রঙের রূপ নেওয়া সুতির সস্তা শার্ট। বাবার হাতে একটা কালচে কাপড়ের ছাতা, যার দুটো শিক ভেতর থেকে ভেঙে বিশ্রীভাবে বেরিয়ে এসেছে। সেই ভাঙা ছাতা বেয়ে বাবার কাঁধে আর মুখে বৃষ্টির শীতল জল ঝরছে। বাবার পুরোনো চশমার কাঁচ দুটো সম্পূর্ণ ঘোলা হয়ে আছে বৃষ্টির সিক্ত বিন্দুতে। সেই ঘোলা কাঁচের ওপাশে বাবার চোখ দুটো কেমন এক লজ্জিত অপরাধীর মতো সংকুচিত হয়ে রইল। তিনি দরজার বাইরে দাঁড়িয়ে থমকে রইলেন, ভেতরে পা বাড়াতে সাহস পেলেন না।

বাবা মৃদু গলায় অপরাধীর সুরে বললেন, 'অনিক, ঘরে কোনো শুকনো পুরোনো গামছা আছে রে বাবা? মেঝেতে এখনই পা দিলে কাদা মেখে ঘর নোংরা হয়ে যাবে। তোদের মা একটু আগেই ঘর লেপেছে, কাদা দেখলে বড় রাগ করবে।' বাবার কণ্ঠস্বর এতই ক্ষীণ ও কম্পিত যেন তিনি কোনো অপরিচিত ধনীর সিংহদ্বারে এসে ভিখারির মতো হাত পেতে দাঁড়িয়েছেন। আমি কোনো কথা না বলে বাবার ভেজা হাতটা ধরে এক টানে ঘরের ভেতর নিয়ে এলাম। বাবার হাত অসম্ভব ঠান্ডা, ঠিক যেন বরফের চাই। এই মানুষটা দীর্ঘ তিন ঘণ্টা ধরে মুষলধারে বৃষ্টিতে ভিজে সদরঘাট বাসস্ট্যান্ড থেকে হেঁটে হেঁটে তিন মাইল পথ পাড়ি দিয়ে এসেছেন, কারণ তাঁর পকেটে রিকশাভাড়ার মাত্র আটটা টাকা ছিল না। অথচ বাবা মুখে এক অদ্ভুত তৃপ্তির ভান করে আছেন।

নীলু ঘর থেকে দৌড়ে বেরিয়ে এল। বাবার এই বিধ্বস্ত রূপ দেখেই তার মায়াবী চোখ দুটো জলে ভরে উঠল। সে এক ছুটে ভেতরের ঘরে গেল এবং মায়ের পুরোনো নরম সুতির শাড়ি দিয়ে তৈরি করা একটি গামছা নিয়ে এল। পরম মমতায় সে বাবার মাথার পাতলা চুল এবং কপাল মুছিয়ে দিতে লাগল। বাবা এক মুহূর্ত স্তব্ধ হয়ে দাঁড়িয়ে রইলেন। তারপর মেয়ের মুখের দিকে তাকিয়ে ম্লান হাসার চেষ্টা করলেন। যে হাসিতে কোনো আনন্দ নেই, শুধুই বুকের ভেতর জমতে থাকা অগাধ বেদনার প্রতিচ্ছবি। বাবা বললেন, 'মা রে, আজ জজকোর্ট থেকে বের হয়ে সদরঘাটের মাছের আড়তে গিয়েছিলাম। ভেবেছিলাম তোদের সবার জন্য দুটো তাজা বড় ইলিশ নিয়ে আসব। আজ ইলিশের মেলা বসেছে নদীর ঘাটে, কী রূপালি চকচকে মাছ! কিন্তু... জানিস মা, ইলিশগুলো আজ বড় বাসি ছিল। টিপ দিলে নরম হয়ে যাচ্ছিল, বাজে গন্ধ বেরোচ্ছিল। তাই আর কিনলাম না রে মা।' বাবার গলার স্বর সামান্য কেঁপে উঠল এবং তিনি চোখ নামিয়ে নিলেন।

আমি বাবার পায়ের দিকে তাকালাম। বাবা নিজের অজান্তেই তাঁর ডান পা-টা বাঁ পায়ের পেছনে লুকানোর আপ্রাণ চেষ্টা করছিলেন। কিন্তু আমার চোখ এড়াতে পারলেন না। বাবার ডান পায়ের পুরোনো স্পঞ্জের চটিটার সামনের ফিতা বহু আগেই ছিঁড়ে গেছে। সেই ফিতাটা বাবা জং ধরা মরচে পড়া লোহার চিকন তার দিয়ে পেঁচিয়ে পেঁচিয়ে কোনোমতে গেঁথে রেখেছেন। সেই জং ধরা তারের ধারালো খোঁচা লেগে বাবার বুড়ো আঙুলের গোড়ায় চামড়া কেটে রক্তের কালচে শুকনো দাগ বসে গেছে। বাবা বাজার থেকে মাছ না আনার অজুহাত দিচ্ছেন, অথচ তিনি জানেন, আমরাও জানি—বাবার মলিন মানিব্যাগে জং ধরা তার কেনার সামান্য পয়সা ছাড়া আর কিছুই অবশিষ্ট ছিল না।

নীলু এক মুহূর্তও কোনো কথা বলল না। সে বাবার মাথা মুছিয়ে দিয়ে সোজা নিচু হয়ে বাবার পা ছুঁয়ে ভেজা চটি দুটো খুলে নিল। এক ফোঁটা তপ্ত অশ্রুজল নীলুর চোখ থেকে টুপ করে বাবার পায়ের কাটা ক্ষতের ওপর পড়ল। বাবা যেন বিদ্যুতের স্পর্শ পেলেন, আঁতকে উঠে পা পিছিয়ে নিলেন। বললেন, 'মা, কী করছিস তুই! মেয়েরা বাপের পায়ে হাত দিতে নেই রে মা, পাপ হয়!' নীলু মুখ তুলল না। বাবার সেই তারের বাঁধন দেওয়া ছেঁড়া চটি দুটো পরম শ্রদ্ধায় দুই হাতে আঁকড়ে ধরে সে কলতলার দিকে চলে গেল। তার কাঁধ দুটো নিঃশব্দে প্রবলভাবে কাঁপছিল। সে কাঁদছে। মধ্যবিত্ত পরিবারের বড় মেয়েদের এই নিঃশব্দ কান্নার কোনো প্রতিষেধক এই পৃথিবীতে কোনো কবি বা চিকিৎসকের জানা নেই।

আমাদের পরিবারের একটি অলিখিত চিরন্তন নিয়ম ছিল—কেউ কখনো কারও প্রকাশ্য কান্না নিয়ে কোনো প্রশ্ন তুলবে না। যদি মা ভাতের হাঁড়ির ঢাকনা খোলার পর চালের অভাব দেখে ডালঘুঁটনি দিয়ে খালি কড়াই ঘষতে ঘষতে আঁচলে চোখ মুছতেন, বাবা তখন বারান্দায় গিয়ে অকারণে কৃত্রিম কাশি দিয়ে গলা পরিষ্কার করতেন। যদি নীলু গভীর রাতে জানালার শিকে কপাল ঠেকিয়ে নিঃশব্দে দাঁড়িয়ে থাকত, আমি তখন ঘুমের ভান করে বিছানায় পাশ ফিরে শুয়ে চোখ বুজে থাকতাম। কান্না এ বাড়িতে কোনো দুর্লভ অলংকার নয়, বরং নিত্যদিনের নীরব ছায়াসঙ্গী। যে পরিবারে দারিদ্র্য দরজায় পাহারা দেয়, সেখানে কান্নাই একমাত্র সম্পদ যা খরচ করতে কোনো পয়সা লাগে না।

সন্ধ্যা নামার আগেই সারা আকাশ ভেঙে আবার কালবৈশাখীর মতো প্রবল বৃষ্টি নামল। যেন আকাশের বুকে জমে থাকা যুগান্তরের সমস্ত পুঞ্জীভূত শোক আজ এই ঢাকার স্যাঁতসেঁতে গলির ওপর ঢেলে দেওয়া হবে। এলাকার বিদ্যুৎ চলে গেছে অনেক আগেই। ঘরে টিমটিম করে জ্বলছে সস্তা কেরোসিনের কুপির শিখা। সেই ম্লান হলুদ আলোয় নীলু রান্নাঘরে চা বসাচ্ছিল। চা-পাতার টিন প্রায় শূন্য। নীলু শেষবারের মতো কেতলিটা চুলায় বসিয়ে দিয়ে পুরোনো ব্যবহৃত চা-পাতাগুলো চামচ দিয়ে চেপে চেপে শেষ নির্যাসটুকু বের করার ব্যর্থ প্রয়াস পাচ্ছিল, যাতে বাবার জন্য অন্তত এক কাপ লাল চা তৈরি করা যায়।

আমি রান্নাঘরের ভাঙা দরজায় গিয়ে দাঁড়ালাম। নীলু আমার দিকে সরাসরি না তাকিয়েই কাঠকয়লার ধোঁয়ার ভেতর থেকে বলল, 'অনিক, আজ বিকেলে ওড়াকান্দির সেই ধনী পাত্রপক্ষ বাবার সাথে কোর্টের বারান্দায় দেখা করতে এসেছিল। তুই কি জানিস?' আমি চমকে উঠলাম। ওড়াকান্দির যে পাত্রের সাথে নীলুর বিয়ের কথা চলছিল, সে সোনালী ব্যাংকের বড় কর্মকর্তা। নীলু মৃদু ও ভাঙা গলায় বলতে লাগল, 'পাত্রের বাবা নাকি বাবার মুখের ওপর সাফ জানিয়ে দিয়েছেন, মেয়ে যদি তাদের ঘরে তুলতে হয় তবে অন্তত পঞ্চাশ হাজার টাকার নগদ যৌতুক আর এক ভরি ওজনের সোনার গয়না দিতে হবে। তা না হলে এই বিয়ের কথা যেন বাবা আর কখনো না তোলেন। বাবা নাকি সেখানে শত শত উকিল-মোক্তারের সামনে তাদের পায়ের কাছে করজোড়ে হাতজোড় করে মিনতি করেছিলেন।' নীলুর গলা কান্নায় সম্পূর্ণ রুদ্ধ হয়ে এল।

আমার বুকের খাঁচায় যেন একখানা ধারালো ছুরি আমূল বিঁধে গেল। যে মানুষটা আত্মসম্মান বাঁচাতে ছেঁড়া চটি পায়ে তার পেঁচিয়ে আদালতে যায়, সেই আত্মমর্যাদাবান পিতা আজ সমাজের ধনিক নরপিশাচদের পায়ের কাছে মেয়ের জন্য হাতজোড় করে ভিখারির মতো কেঁদেছেন! নীলু শাড়ির আঁচল দিয়ে চোখের জল দ্রুত মুছে ফেলল। তারপর আমার দিকে তাকিয়ে এমন এক স্বর্গীয় মায়াবী হাসি উপহার দিল, যা দেখলে যেকোনো পাষাণের বুকও বিদীর্ণ হয়ে যাবে। নীলু বলল, 'অনিক, আমি আজ মনে মনে প্রতিজ্ঞা করেছি। কাল সকালেই আমি বাবাকে পরিষ্কার জানিয়ে দেব—আমার কোনো বিয়েতে মত নেই। আমি সারাজীবন তোদের সাথে এই ভাঙা ঘরেই থাকব। বাবার ছেঁড়া চটিগুলো আমি নিজ হাতে রঙিন সুতো দিয়ে সেলাই করে দেব। আমার কিচ্ছু লাগবে না রে ভাই, সত্যি বলছি আমার কোনো গয়না বা রাজপ্রাসাদের লোভ নেই।' এই বলে নীলু আমার কাঁধে মুখ গুঁজে ফুঁপিয়ে কেঁদে উঠল। বাইরে তখন শ্রাবণের দামাল বাতাস পুরোনো টিনের চালে আর্তনাদ করে আছড়ে পড়ছে, আর ঘরের কোণে নিভে যাচ্ছে কুপির সলতে।

      }
    ]

const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderStories(filter=""){const list=$("storyList"),items=STORIES.filter(s=>(s.title+" "+(s.category||"")).toLowerCase().includes(filter.toLowerCase()));
if(!items.length){list.innerHTML=`<div class="empty" style="grid-column:1/-1"><strong>${STORIES.length?"কোনো গল্প পাওয়া যায়নি":"এখনো কোনো গল্প প্রকাশিত হয়নি"}</strong>${STORIES.length?"অন্য নামে খুঁজে দেখুন।":"নতুন গল্প যোগ হলে সেগুলো এখানে দেখা যাবে।"}</div>`;return}
list.innerHTML=items.map(s=>`<article class="story" tabindex="0" data-id="${encodeURIComponent(s.id)}"><h3>${esc(s.title)}</h3><p>${esc(s.category||"গল্প")} · ${(s.episodes||[]).length}টি পর্ব</p><p style="margin-top:8px">${esc(s.description||"")}</p></article>`).join("");
list.querySelectorAll(".story").forEach(card=>{const open=()=>showStory(decodeURIComponent(card.dataset.id));card.addEventListener("click",open);card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}})})}
function showStory(id){const s=STORIES.find(x=>x.id===id);if(!s)return;$("homeView").classList.add("hidden");$("storyView").classList.remove("hidden");
const eps=(s.episodes||[]).map((ep,i)=>`<article class="episode"><h3>${esc(ep.title||("পর্ব "+(i+1)))}</h3><div class="episode-body">${esc(ep.content||"")}</div></article>`).join("");
$("storyContent").innerHTML=`<h2 class="section-title">${esc(s.title)}</h2><p style="color:var(--muted)">${esc(s.category||"গল্প")}</p><p>${esc(s.description||"")}</p>${eps||'<div class="empty">এই গল্পের পর্ব এখনো যোগ করা হয়নি।</div>'}`;location.hash="story="+encodeURIComponent(id)}
