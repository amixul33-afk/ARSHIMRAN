<script>
const SITE = {
  title: "ARSH IMRAN",
  intro: "এখানে আমি আমার লেখা গল্পগুলো রাখি।",
  author: "Arsh Imran"
};

const STORIES = [
  {
    id: "shrabaner-sondhebelay-1",
    cover: "",
    title: "শ্রাবণের সন্ধেবেলায় (প্রথম পর্ব)",
    date: "৪ নভেম্বর ২০২৬",
    text: `মানুষের জীবনে কিছু দিন আসে যেদিন সকালবেলা ঘুম ভাঙার সঙ্গে সঙ্গেই মনে হয়—আজ নিশ্চয়ই কোনো একটি অলৌকিক কাণ্ড ঘটবে। শুভ্রাংশুর ঘুম যখন ভাঙল, তখন ঘরের একচিলতে কাঠের জানালার ফাঁক গলে একঝাঁক ঠান্ডা বাতাস এসে তার মুখে লাগল। বাতাসটা সাধারণ কোনো বাতাস নয়; এতে সোঁদা মাটির ঘ্রাণ আর ভিজা কদম ফুলের গন্ধ মাখানো। বাইরে তুমুল বৃষ্টি নামার আগের যে থমথমে ধূসর আলো, সেই আলোয় পুরো কামরাটা এক অদ্ভুত নীলচে রূপ নিয়েছে। শুভ্রাংশু বালিশে মাথা রেখেই বুঝল, আজ শ্রাবণের কোনো এক অলুক্ষণে দিন।

ঠিক তখনই পাশের ঘর থেকে বড়মামা মোবারক হোসেনের চিল-চিৎকার ভেসে এলো—'শুভ্র! ওরে ও নবাব সিরাজউদ্দৌলার খালাতো ভাই শুভ্র! তুই কি এখনও নাক ডেকে কুম্ভকর্ণের বংশমর্যাদা রক্ষা করছিস? শিগগির এদিকে আয়! একটা জাতীয় বিপর্যয় ঘটে গেছে!' শুভ্রাংশু দীর্ঘশ্বাস ফেলল। বড়মামার জীবনে প্রতি সপ্তাহে অন্তত তিনটি 'জাতীয় বিপর্যয়' ঘটে। গত মঙ্গলবার তাঁর জাতীয় বিপর্যয় ছিল—তিনি আবিষ্কার করেছিলেন যে তাঁর বাঁ পায়ের বুড়ো আঙুলের নখটা ডান পায়ের চেয়ে দুই মিলিমিটার বেশি চওড়া। সেই দুঃখে তিনি সারা দুপুর ভাত না খেয়ে বারান্দায় বসে রবীন্দ্রনাথের মৃত্যুদিনের আবহাওয়া নিয়ে গবেষণা করেছিলেন।

শুভ্রাংশু চোখ কচলাতে কচলাতে মামার পড়ার ঘরে গিয়ে দাঁড়াল। ঘরটির অবস্থা দেখলে যে কোনো সভ্য মানুষের মূর্ছা যাওয়ার কথা। চারপাশে মেঝে থেকে ছাদ পর্যন্ত পুরানো বইয়ের স্তূপ। মাঝখানে একটা ভাঙা সেগুন কাঠের গোল টেবিল। টেবিলে জ্বলছে একটা পিতলের হারিকেন, যদিও এখন সকাল আটটা। বড়মামা খালি গায়ে, লুঙ্গি মালকোঁচা মেরে একটা বিশাল ম্যাগনিফাইং গ্লাস দিয়ে একটা সেদ্ধ ডিম পর্যবেক্ষণ করছেন। শুভ্রাংশুকে দেখেই তিনি গম্ভীর গলায় বললেন, 'শুভ্র, তোকে একটা বৈজ্ঞানিক সত্য বলি। মানুষের জীবনে তিনটি জিনিস কোনোদিন প্রেডিক্ট করা যায় না—এক হচ্ছে ট্রেনের সময়সূচি, দুই হচ্ছে নারীর মন, আর তিন হচ্ছে হাঁসের ডিমের কুসুমের অবস্থান। দেখ, এই ডিমটার কুসুম মাঝামাঝি না থেকে অদ্ভুতভাবে উত্তর-পূর্ব কোণে হেলে আছে। এর স্পষ্ট অর্থ হলো—আজ পৃথিবীর ম্যাগনেটিক ফিল্ডে কোনো গণ্ডগোল হয়েছে!'

শুভ্রাংশু আলগোছে টেবিলের এক কোণে বসে বলল, 'মামা, এটা হাঁসের ডিম না, মুরগির ডিম। আর ময়না বুজি এটা ফ্রিজ থেকে নামিয়ে তাড়াহুড়ো করে বেশি তাপে সেদ্ধ করেছে, তাই কুসুম সরে গেছে। ম্যাগনেটিক ফিল্ডের কোনো দোষ নেই।' বড়মামা চশমার ফাঁক দিয়ে তার দিকে এমন এক চাউনি দিলেন যেন শুভ্রাংশু একটা বিপজ্জনক আন্তর্জাতিক ষড়যন্ত্রকারী। তিনি চশমাটা নাকের ডগায় নামিয়ে বললেন, 'তুই তো মূর্খ! তুই রবি ঠাকুরের সেই বিখ্যাত পঙক্তি শুনবি? যেখানে তিনি বলেছিলেন—ওরে অবোধ, কুসুমের গতিতেই নির্ধারিত হয় ভবিতব্য! কবিগুরু ডিম নিয়ে লেখেননি ঠিকই, কিন্তু ভাবার্থটা তো এক!' বড়মামার এই এক অদ্ভুত স্বভাব—যে কোনো যুক্তির শেষে রবীন্দ্রনাথের নামে স্বরচিত কবিতা গুঁজে দেওয়া।

ঠিক এই সময় ময়না বুজি এক কাপ ধোঁয়া ওঠা আদা চা আর একটা ভিজে নীল খাম নিয়ে ঘরে ঢুকল। ময়না বুজির বয়স ষাটের কোঠায়, পানের রসে দাঁত লাল। সে খামটা শুভ্রাংশুর দিকে এগিয়ে দিয়ে বলল, 'ছোট মিয়া, নিচে একটা রিকশাওয়ালা ছাতি মাথায় দিয়া খাড়ায়া ছিল। কইল আপনেরে এই চিঠিটা দিয়া যাইতে। কইছে, উত্তর নাকি লাগব না।' নীল খামটা দেখেই শুভ্রাংশুর বুকের ভেতরটা কেমন যেন ছলাৎ করে উঠল। এমন ঘন নীল খাম এই ঢাকা শহরে কেবল একজনই ব্যবহার করত—কুহু। খামের গায়ে তার সেই পরিচিত গোল গোল টানা হাতের লেখা: 'শুভ্রাংশু, যার ছাতা নেই অথচ যে বৃষ্টিতে ভিজতে ভয় পায়।'

বড়মামা ডিম ছেড়ে এক লাফে শুভ্রাংশুর সামনে এসে দাঁড়ালেন। 'কার চিঠি রে শুভ্র? কোনো সাহিত্য পত্রিকা? আমার সেই প্রবন্ধটা কি ওরা ছাপল—'বৃষ্টির দিনে চায়ের কাপে চিনির অণুর মানসিক বিশৃঙ্খলা'? নাকি অন্য কিছু?' শুভ্রাংশু চিঠিটা চট করে পকেটে গুঁজে বলল, 'মামা, এটা একটা দরখাস্ত।' মামা নাক কুঁচকে বললেন, 'দরখাস্ত তো সাদা কাগজে হয় রে বোকা, নীল কাগজে তো কেবল প্রেমের চিঠি অথবা ফাঁসির হুকুম আসে। যাক গে, চা ঠান্ডা হয়ে গেলে তা আর চা থাকে না, এক ধরনের বিষাক্ত ক্বাথ হয়ে দাঁড়ায়। দুনিয়ার অর্ধেক সংসার ভেঙেছে ঠান্ডা চা খাওয়ার অপরাধে! তুই চা শেষ করে আমাকে বিশটা টাকা ধার দে তো। কদমতলীর মোড়ে গিয়ে তামাক আনতে হবে।' শুভ্রাংশু পকেট হাতড়ে দুটো দশ টাকার ভিজে নোট মামার হাতে দিয়ে ছাতা না নিয়েই বেরিয়ে পড়ল।

সিঁড়ি দিয়ে নামতেই বৃষ্টির গর্জন স্পষ্ট হলো। যেন আকাশের সমস্ত মেঘ আজ ঢাকা শহরের ওপর তাদের বুক খালি করে দেবে বলে শপথ করেছে। গলির মুখে কদমতলীর সোবহান মিয়া রিকশার হুড তুলে বসে বিড়ি ফুঁকছিল। শুভ্রাংশুকে দেখে সে একগাল হেসে বলল, 'আইসেন মামা! আপনার লাইগাই তো বইয়া আছি। আইজকা যে বৃষ্টি নামছে, আইজকা কোনো ভালো মানুষ ঘরে বইয়া থাকতে পারে না। খালি চোর আর কবিরা এই দিনে পথে নামে।' শুভ্রাংশু রিকশায় উঠে বসল। সোবহান মিয়া প্যাডেলে চাপ দিল। প্যাডেলের ক্যাঁচক্যাঁচ শব্দ আর টিনের চালে বৃষ্টির রিমঝিম শব্দ মিলে মিশে এক অদ্ভুত সুর তৈরি করল।

রিকশার কালো রেক্সিনের হুডের নিচে বসে শুভ্রাংশু কাঁপাকাঁপা হাতে নীল খামটা খুলল। খামের ভেতর থেকে শুকিয়ে যাওয়া কদম ফুলের দুটো পাপড়ি ঝরে তার কোলের ওপর পড়ল। আর বেরিয়ে এলো দুটি পাতার চিঠি। চিঠির প্রথম লাইনটা পড়েই শুভ্রাংশুর চোখ ঝাপসা হয়ে এলো। কুহু লিখেছে: 'শুভ্রাংশু, তুমি যখন এই চিঠিটা পড়বে তখন হয়তো আমি আর তোমাদের এই কোলাহলমুখর ঢাকা শহরে নেই। বাবা আমাকে কাল রাতেই খুলনার স্টিমারে তুলে দিচ্ছেন। আমার বিয়ে ঠিক হয়েছে। ছেলে সরকারি কলেজের রসায়নের অধ্যাপক। খুব ভালো মানুষ, সিগারেট খান না, অপ্রয়োজনে হাসেন না, আর বৃষ্টি হলে ঘরের সব জানালা বন্ধ করে দেন।'

চিঠির পরের প্যারাটায় কুহু লিখেছে: 'তুমি কি মনে করতে পারো শুভ্রাংশু? সেই যে গত বছর শ্রাবণের বিকেলে তুমি আমাকে বলেছিলে—কুহু, মানুষ যখন খুব হাসে তখন নাকি তার বুকের ভেতরের একটা পাখি কেঁদে মরে? আমি কাল সারারাত আয়নার সামনে দাঁড়িয়ে প্রাণপণে হেসেছি। বিশ্বাস করো, আমার বুকের ভেতরের পাখিটা কিন্তু একটুও কাঁদেনি; সে মরে কাঠ হয়ে গেছে। আমার শুধু একবার তোমার ওই বোকা বড়মামার খ্যাপাটে কথাগুলো শুনতে ইচ্ছে করছিল। আর খুব ইচ্ছে করছিল তোমার রিকশায় ভিজে ভিজে নিউমার্কেটের মোড়ে গিয়ে সস্তা কাচের লাল চুড়ি কিনতে। তুমি তো জানো, আমার হাতটা বড্ড খালি।' চিঠির শেষটায় চোখের জলের শুকনো দাগ স্পষ্ট হয়ে লেপ্টে আছে কালির ওপর।

সোবহান মিয়া রিকশা চালাতে চালাতে হঠাৎ পেছন ফিরে বলল, 'মামা, কানতেছেন নাকি? আফনের গাল বাইয়া পানি পড়তেছে তো!' শুভ্রাংশু তাড়াতাড়ি চোখ মুছে মলিন হাসল। 'না রে সোবহান, বৃষ্টির ছাঁট লেগেছে।' সোবহান মিয়া এক মুহূর্ত তার দিকে তাকিয়ে রইল। তারপর বিজ্ঞের মতো একটা দীর্ঘশ্বাস ফেলে বলল, 'হ মামা, বৃষ্টির দিনে কানলে এই এক সুবিধা। খোদার দুনিয়ায় কেউ টের পায় না কোন চোখের পানি আর কোন আকাশের বৃষ্টি। দুঃখ জিনিসটা হইলো বৃষ্টির মতো বাজান—জোর কইরা থামানো যায় না, ভিজ্যা ভিজ্যাই শেষ করতে হয়।' রিকশাটা কদমতলীর মোড় পার হয়ে ধানমন্ডির নির্জন লেকের দিকে এগোতে লাগল। আকাশ ভেঙে তখন জল নামছে, যেন এই পৃথিবীর কোনো শোকই আর অপ্রকাশিত থাকবে না।

  title: "শ্রাবণের সন্ধেবেলায় (দ্বিতীয় পর্ব)",
  date: "৬ নভেম্বর ২০২৬",
  text: `সন্ধ্যা নামার আগেই সারা শহরের বিদ্যুৎ চলে গেল। লোডশেডিংয়ের এই এক মহিমা—বিদ্যুৎ চলে গেলেই ঢাকা শহরের মানুষের আভিজাত্য খসে পড়ে। বড় বড় দালানকোঠাগুলো হঠাৎ ভূতুড়ে অন্ধকার হয়ে যায়, আর মোড়ের চায়ের দোকানগুলোতে কেরোসিনের কুপির হলুদ শিখা টিমটিম করে জ্বলে ওঠে। শুভ্রাংশু যখন ভিজে একাকার হয়ে বাড়ি ফিরল, তখন বারান্দায় দাঁড়িয়ে বড়মামা আকাশের দিকে মুখ তুলে কী যেন বিড়বিড় করছিলেন। তাঁর হাতে একটা পুরানো রিভলভারের খাপের মতো চামড়ার খোলস, কিন্তু খোলসের ভেতর কোনো অস্ত্র নেই; আছে একটা মরচে পড়া সাইকেলের ঘণ্টি।

বড়মামা পেছনে না তাকিয়েই বললেন, 'শব্দ শুনলেই আমি বুঝতে পারি আগন্তুক পাপী না পুণ্যবান। তোর পায়ের চটি দিয়ে যে চপচপ আওয়াজ হচ্ছে, এতে স্পষ্টভাবে প্রমাণিত হয় তুই জীবনে কোনো কঠিন সিদ্ধান্ত নিতে পারিসনি। সিদ্ধান্তহীন মানুষের পায়ের আওয়াজে কোনো ছন্দ থাকে না।' শুভ্রাংশু কোনো উত্তর দিল না। সে গামছা দিয়ে মাথা মুছতে লাগল। মামা এবার ঘুরে দাঁড়িয়ে হারিকেনের আলো তার মুখের ওপর ফেললেন। 'তোর চোখ দুটো এত লাল কেন রে? তুই কি গাঁজা খাওয়া শুরু করেছিস? নাকি কদমতলীর সোবহান মিয়ার সঙ্গে বসে বিড়ির ধোঁয়া টেনেছিস?'

'না মামা, চোখে পোকা পড়েছিল।' শুভ্রাংশু মৃদু গলায় বলল। বড়মামা অবিশ্বাসের ভঙ্গিতে মাথা নাড়লেন। 'পোকা কেবল বোকা মানুষের চোখেই পড়ে। বিজ্ঞ মানুষের চোখে পোকা ঢুকতে পারে না, কারণ তাদের দৃষ্টিশক্তি প্রখর। শোন শুভ্র, তুই যখন বাইরে ছিলি তখন সদরঘাট থেকে একটা লোক এসেছিল। কুহুর মামার বাড়ির কাজের ছেলে কাসেম। সে তোর নামে একটা প্যাকেট রেখে গেছে।' শুভ্রাংশুর হাত থেমে গেল। 'প্যাকেট? কী প্যাকেট মামা?' বড়মামা তাচ্ছিল্যের সঙ্গে ঘরের মেঝের দিকে আঙুল নির্দেশ করলেন। সেখানে খবরের কাগজে মোড়ানো একটা ছোট্ট চৌকো বাক্স পড়ে আছে।

বড়মামা বললেন, 'আমি প্যাকেটটা ওজন করে দেখেছি। আনুমানিক তিনশত পঞ্চাশ গ্রাম। এর ভেতর বিস্ফোরক থাকার সম্ভাবনা শূন্যের কোঠায়, তবে মানসিক বিস্ফোরক থাকতে পারে। তোর মামী যখন আমাকে ছেড়ে চলে যায়, তখনো ঠিক এই ওজনের একটা প্যাকেট পাঠিয়েছিল। প্যাকেটে ছিল একজোড়া আধভাঙা চীনামাটির কাপ আর একটা তিন ব্যাটারির টর্চলাইট। টর্চলাইটটার অর্থ ছিল—তিনি আশা করেন আমার অন্ধকার ভবিষ্যৎ যেন কিছুটা আলোকিত হয়! হা হা হা!' বড়মামা এক অদ্ভুত শুকনো হাসি হাসলেন। সেই হাসির শব্দে সারা ঘরে এক হিমশীতল শূন্যতা ছড়িয়ে পড়ল। শুভ্রাংশু জানে, বড়মামার এই অট্টহাসিটাই আসলে তাঁর কান্না। পঁচিশ বছর আগে মামী অন্য এক ধনী ব্যবসায়ীর হাত ধরে চলে যাওয়ার পর মামা কোনোদিন একফোঁটা চোখের জল ফেলেননি; কেবল এমন অট্টহাসি হেসে ঘরের জানালার কপাট বন্ধ করে দিতেন।

শুভ্রাংশু প্যাকেটটা তুলে নিয়ে তার ঘরে গেল। মোমবাতি জ্বালিয়ে খবরের কাগজের বাঁধন খুলতেই বেরিয়ে এলো এক ডজন কাচের লাল রেশমি চুড়ি। আর তার নিচে ভাঁজ করা একটা ছোট্ট চিরকুট। তাতে কাঁপাকাঁপা অক্ষরে লেখা: 'শুভ্রাংশু, আজ বিকেলে খুলনার লঞ্চে ওঠার আগে আমি এক ফেরিওয়ালার কাছ থেকে চুড়িগুলো কিনেছি। তুমি তো কোনোদিন আমাকে কিছু কিনে দিলে না। আজ আমার টাকায় কেনা চুড়িগুলো তোমাকে দিয়ে গেলাম। তুমি কোনো এক শ্রাবণের রাতে যখন অন্য কারও হাত ধরবে, তখন তাকে এই চুড়িগুলো পরিয়ে দিয়ো। আর বোলো—এক পাগল মেয়ে এগুলো দিয়ে এক জন্ম ঋণ শোধ করে গেছে।'

চুড়িগুলো হাতে নিয়ে শুভ্রাংশুর মনে হলো, কাচের চুড়িগুলো যেন বরফের মতো ঠান্ডা। প্রতিটি চুড়ির গায়ে আলো লেগে এক রক্তিম আভা ছড়িয়ে পড়ছে। ঠিক এই সময় রান্নাঘর থেকে ইলিশ মাছ ভাজার গন্ধ আর তেল ছিটকানোর শব্দ এলো। ময়না বুজি মোমবাতির আলোয় কাঠের পিঁড়িতে বসে রাতের রান্না চড়িয়েছে। শুভ্রাংশু রান্নাঘরের চৌকাঠে গিয়ে দাঁড়াল। ময়না বুজি তাকে দেখে আঁচলে হাত মুছে বলল, 'ছোট মিয়া, শরীরটা ভিজাইয়া আসছ। ঠাণ্ডা লাগব তো। এক বাটি গরম ভাতের ফ্যান খাইয়া লও।' শুভ্রাংশু বলল, 'বুজি, মানুষ মানুষকে ছেড়ে যায় কেন বলতে পারো?'

ময়না বুজি কড়াইয়ের মাছটা উল্টে দিয়ে এক মুহূর্ত চুপ করে রইল। চুলার আগুনের লালচে আলো তার বলিরেখাভরা মুখে এক বিষাদময় ছায়া ফেলেছে। সে একটা গভীর নিঃশ্বাস ফেলে বলল, 'ছোট মিয়া, নদী যখন সাগরে যায়, তখন কি তার ইচ্ছা থাকে চরের বালুরে ছাইড়া যাইতে? জোয়ারের টানে যাইতে হয়। কুহু মাইয়াডা রাজকন্যার লাহান। তার বাপে গরিব কেরানি। বড় ঘরে বিয়া না দিলে তার ভাতের হাড়িতে চাল জুটব না। তুমি অইলা বাউণ্ডুলে মানুষ। আইজ এইখানে তো কাইল ওইখানে। মাইয়া মাইনষের জীবন হইলো লতার লাহান, শক্ত খুঁটি না পাইলে বাঁচে না। তুমি তো নিজেই খুঁটি ছাড়া নাওয়ের মতো ভাসতেছ।' ময়না বুজির এই সহজ সত্যটা তীরের ফলার মতো শুভ্রাংশুর বুকে গিয়ে বিঁধল।

রাত তখন বারোটা। বাইরে বৃষ্টির বেগ কিছুটা কমে ঝিরঝিরে বৃষ্টিতে রূপ নিয়েছে। বড়মামা তাঁর পড়ার ঘরে বসে টেপরেকর্ডারে একটা পুরোনো ক্যাসেট বাজাতে শুরু করেছেন। আব্বাসউদ্দিনের কণ্ঠে বিরহী গান—'নাও ছাড়িয়া দে... পাল উড়াইয়া দে...'। গানের করুণ সুর পুরো বাড়ির বাতাসে ভারী হয়ে ভাসছে। শুভ্রাংশু তার বিছানায় শুয়ে সিলিংয়ের দিকে তাকিয়ে রইল। জানালার কার্নিশ থেকে টুপটুপ করে জল পড়ার শব্দ ছাড়া পৃথিবীতে আর কোনো শব্দ নেই। হঠাৎ বড়মামার ঘরের দিক থেকে কাচ ভাঙার মৃদু শব্দ এলো। শুভ্রাংশু দ্রুত উঠে গিয়ে দেখল, বড়মামা তাঁর টেবিলে রাখা ডিমের খোসাগুলো চূর্ণবিচূর্ণ করে ফেলেছেন। তাঁর চোখের কোণ দিয়ে গড়িয়ে পড়া দুটো জলের ফোঁটা হারিকেনের আলোয় মুক্তোর দানার মতো জ্বলছে।

শুভ্রাংশু দরজায় দাঁড়িয়ে বলল, 'মামা, তুমি কাঁদছ?' বড়মামা চট করে চোখ মুছে টেবিলের ওপর সজোরে থাবা বসালেন। 'কে কাঁদে? কোন হতভাগা কাঁদে? তোর মাথায় কি ঘিলু নেই শুভ্র? আমি কান্না করব কোন দুঃখে! হারিকেনের চিমনি থেকে অতিরিক্ত কার্বন ডাই-অক্সাইড বের হচ্ছে, সেই ধোঁয়ায় চোখে জল এসে গেছে। তুই বরং যা, কাল সকালের প্রথম ট্রেনের টিকিট কাটবি। আমরা একবার কুষ্টিয়ায় যাব। সেখানে এক লালন ফকিরের মাজারে গিয়ে তোর এই মস্তিষ্কের বিকার সারিয়ে আনব।' বড়মামা জোর করে হাসার চেষ্টা করলেন, কিন্তু তাঁর ঠোঁটের কোণ থরথর করে কাঁপতে লাগল। শুভ্রাংশু বুঝল, আজ রাতে এই বাড়িতে কেউ ঘুমোবে না—না সে, না তার বড়মামা, না জানালার বাইরে কান পেতে থাকা শ্রাবণের রাত।

চলবে....`
}

];
/* ===== গল্পের তালিকা শেষ ===== */
const app=document.getElementById('app');
const categories=['সব','গল্প','উপন্যাস','কবিতা'];let activeCategory='সব';
function category(s){return s.category||'গল্প'}
function coverMarkup(s){return s.cover?`<div class="cover"><img src="${escapeAttr(s.cover)}" alt="${escapeAttr(s.title)} প্রচ্ছদ"></div>`:`<div class="cover">${escapeHtml(s.title)}</div>`}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escapeAttr(v){return escapeHtml(v)}
function shell(content){app.innerHTML=content;document.getElementById('year').textContent=new Date().getFullYear();}
function cards(list){if(!list.length)return '<div class="empty">কোনো লেখা পাওয়া যায়নি। অন্য শব্দ দিয়ে খুঁজুন।</div>';return `<div class="grid">${list.map(s=>`<article class="story-card"><a href="#${encodeURIComponent(s.id)}">${coverMarkup(s)}</a><div class="card-body"><span class="tag">${escapeHtml(category(s))}</span><h3><a href="#${encodeURIComponent(s.id)}">${escapeHtml(s.title)}</a></h3><div class="date">${escapeHtml(s.date||'')}</div><p class="excerpt">${escapeHtml(s.text.trim().split(/\n\s*\n/)[0].slice(0,115))}…</p><a class="readlink" href="#${encodeURIComponent(s.id)}">পুরোটা পড়ুন →</a></div></article>`).join('')}</div>`}
function home(){document.title=SITE.title+' — সাহিত্যভুবন';shell(`<section class="hero"><div class="wrap"><div class="eyebrow">একজন লেখকের ব্যক্তিগত পাঠভুবন</div><h1>${escapeHtml(SITE.title)}</h1><div class="hero-rule"></div><p>${escapeHtml(SITE.intro)} গল্প, উপন্যাস ও কবিতার পাতায় আপনাকে স্বাগতম।</p></div></section><section class="wrap page"><div class="section-head"><div><h2>সাম্প্রতিক লেখা</h2><p>শব্দের ভেতর দিয়ে অন্য এক জগতে</p></div></div><div class="tools"><input class="search" id="search" placeholder="গল্প বা লেখার নাম খুঁজুন…" aria-label="লেখা খুঁজুন"><div class="filters">${categories.map(c=>`<button class="chip ${c===activeCategory?'active':''}" data-cat="${c}">${c}</button>`).join('')}</div></div><div id="results">${cards(filterStories('',''))}</div></section>`);bindList();}
function filterStories(q,cat){return STORIES.filter(s=>(cat==='সব'||category(s)===cat)&&(`${s.title} ${s.text}`).toLowerCase().includes(q.toLowerCase()))}
function bindList(){const search=document.getElementById('search');search?.addEventListener('input',()=>{document.getElementById('results').innerHTML=cards(filterStories(search.value,activeCategory))});document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{activeCategory=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('results').innerHTML=cards(filterStories(search.value,activeCategory))}));}
function allPage(){activeCategory='সব';home();document.querySelector('.hero').style.display='none';document.querySelector('.section-head h2').textContent='সকল লেখা';}
function storyPage(s){document.title=s.title+' | '+SITE.title;const paras=s.text.trim().split(/\n\s*\n/).map(p=>`<p>${escapeHtml(p.trim())}</p>`).join('');shell(`<section class="wrap page"><a class="back" href="#all">← সকল লেখায় ফিরুন</a><article class="article"><span class="tag">${escapeHtml(category(s))}</span><h1>${escapeHtml(s.title)}</h1><div class="date">${escapeHtml(s.date||'')}</div><div class="article-cover">${coverMarkup(s)}</div><div class="article-text">${paras}</div><div class="article-actions"><button class="action" id="shareBtn">↗ শেয়ার করুন</button><button class="action" onclick="window.print()">প্রিন্ট / PDF</button></div></article></section>`);document.getElementById('shareBtn').addEventListener('click',async()=>{const shareData={title:s.title,text:s.title+' — '+SITE.title,url:location.href};try{if(navigator.share)await navigator.share(shareData);else{await navigator.clipboard.writeText(location.href);alert('লিংক কপি হয়েছে');}}catch(e){}});window.scrollTo(0,0)}
function aboutPage(){document.title='লেখক পরিচিতি | '+SITE.title;shell(`<section class="wrap page"><article class="about"><div class="eyebrow">লেখক পরিচিতি</div><h1>${escapeHtml(SITE.author)}</h1><p>শব্দ, অনুভূতি ও কল্পনার ভেতর দিয়ে গল্প বলাই এই লেখার ঠিকানার উদ্দেশ্য। এখানে লেখকের গল্প, উপন্যাস ও কবিতা ধারাবাহিকভাবে প্রকাশিত হবে।</p><p>নতুন লেখা পড়তে <a href="#all" style="color:var(--accent)">সকল লেখা</a> বিভাগে যান।</p></article></section>`)}
function route(){const raw=decodeURIComponent(location.hash.slice(1));if(raw==='about')return aboutPage();if(raw==='all')return allPage();const s=STORIES.find(x=>x.id===raw);if(s)return storyPage(s);home();}
window.addEventListener('hashchange',route);document.getElementById('themeBtn').addEventListener('click',()=>{document.documentElement.classList.toggle('dark');localStorage.setItem('arsh-theme',document.documentElement.classList.contains('dark')?'dark':'light')});if(localStorage.getItem('arsh-theme')==='dark')document.documentElement.classList.add('dark');document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('nav').classList.toggle('open'));document.querySelectorAll('[data-page]').forEach(a=>a.addEventListener('click',()=>document.getElementById('nav').classList.remove('open')));route();
</script></body></html>
